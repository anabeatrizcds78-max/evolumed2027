o cruzeiros na que Rubem Braga publicou como sendo o autor. Tempos depois, Fernando Sabino pediu um texto a Rubem Braga, que lhe devolveu o texto da “sopa”. Sabino utilizou-a , mas inflacionou o preço da sopa que passou a custar dez cruzeiros.","4":"As crônicas são geralmente publicadas em órgãos de imprensa, por isso elas apresentam um estilo informal, em que há o emprego de linguagem corrente, procurando-se, assim, uma interação com o leitor comum.","5":"A locução conjuntiva “a não ser” tem valor condi - cional, indica uma hipótese ou possibilidade, assim como “se, caso, salvo, contanto que, desde que”.","6":"“Acabou me dando de volta a da sopa.” deixa implícito o substantivo crônica: “Acabou me dando de volta a crônica da sopa.”.","7":"Esse excerto apresenta passagens muito evidentes, que caracterizam a estética Surrealista, como se nota, por exemplo, na referência “ à onipotência dos sonhos e no jogo desinteressado do pensamento” e na “criação de uma realidade absoluta, uma suprarrealidade”. Além dessas evidências, há o nome de André Breton, teórico e poeta do Surrealismo, vanguarda do onírico e do aparentemente ilógico, mas presente no inconsciente.","8":"Na pergunta “Qual o sentido da vida”, a palavra “sentido” é ambígua, pode tanto ser um questio - namento existencial, uma dúvida metafísica, quanto referir-se aos órgãos de sentido, que foi o enten - dimento da companheira, que escolhe o “tato” (aconchegando-se ao interlocutor) como o órgão sensorial mais importante.","10":"O texto discute os possíveis tipos de contaminação entre a Terra e outros locais do espaço sideral.","11":"O primeiro parágrafo menciona o desconforto experimentado pelos astronautas da Apolo 11 dentro de suas cápsulas. No texto: “... the three astronauts were waiting to be packed up inside their capsule floating in the Pacific Ocean – and they were hot and uncomfortable”.","12":"No segundo parágrafo, “forward contamination” é explicada como contaminação que poderia ser levada, acidentalmente, além da Terra. Lê-se no texto: “Firstly, there was the fear of ‘forward contamination’ – the possibility that Earth-based life might accidentally hitch a ride into the cosmos.”","13":"De acordo com os terceiro e quarto parágrafos, as controvérsias sobre os potenciais riscos implicados no retorno da Apolo 11 foram finalmente estabelecidas. Tomaram-se medidas para a entrada na Terra, tais como: equipamento de quarentena e um período de isolamento de 21 dias para os astronautas. No texto: “NASA put several quarantine measures in place — in some cases, a little reluctantly. Concerned officials from the US Public Health Service argued for stricter measures than initially planned, pointing out that they had the power to refuse border entry to contaminated astronauts. NASA then agreed to install a costly quarantine facility on the ship that would pick up the men from their splashdown in the Pacific Ocean. It was also agreed that the lunar explorers would then spend three weeks in isolation before they could hug their families or shake the hand of the president.”","14":"O anúncio usa texto e a imagem de duas mulheres astronautas em trajes espaciais para sugerir que tanto o óleo “Skin-So-Soft” quanto a vestimenta são essen - ciais para àquelas que as têm. Lê-se no anúncio: “Never go anywhere without your Skin-So-Soft”.","15":"As sociedades africanas sem escrita (ágrafas) utilizavam a tradição oral para conectarem-se com o passado compartilhando com os membros do grupo seus valores religiosos e experiências com o sobrenatural. Ademais, enraizavam nas gerações, do presente e do futuro, sua cultura, seus valores, festas, usos e costumes com vistas a dar uma identidade à comunidade.","16":"Elemento central do sistema colonial, o chamado “exclusivo” constituía o monopólio de comércio e navegação sobre a colônia por parte da Metrópole, garantindo a acumulação primitiva de capital nesta última. Os privilégios concedidos à burguesia metropolitana estavam inseridos em uma rede de relações econômicas lideradas por um Estado absolutista que possuía uma política intervencionista. Este estabelecia tarifas protecionistas visando a alcançar uma balança comercial favorável e acumular metal amoedável – ouro e prata – provenientes das áreas coloniais.","17":"Uma das mais notáveis mudanças causadas pela Revolução Industrial, a partir da segunda metade do século XVIII, foi a subordinação dos ritmos de vida ao “tempo da máquina”. As longas jornadas demandadas nas fábricas passaram a organizar a rotina diária dos operários em cidades cada vez mais populosas, com bairros operários cada vez maiores, muitas vezes próximos às indústrias que se instalam. O sinal da fábrica, marcando horários de entrada e saída predeterminados, pode ser visto como um dos elementos dessa transformação.","18":"O presidente Campos Salles organizou a “Política dos Governadores” articulando os interesses de oligarquias estaduais com a atuação do governo federal buscando obter apoio para aprovação de suas políticas no Congresso Nacional. Na prática o governo federal obtinha apoio e em contrapartida não intervinha nos assuntos estaduais. Localmente, o poder ficava nas mãos dos grandes proprietários rurais (“coronéis”), que, controlando os eleitores, com violência ou utilizando laços de apadrinhamento, sustentavam a oligarquia estadual.","20":"O excerto da canção “Alegria Alegria”, de Caetano Veloso, de 1967, revela-nos, por meio da letra, temas e cenas de uma época do Brasil em meio à ditadura e do mundo na Guerra Fria. O single, conforme desejo do próprio compositor, deveria revelar o consumo de novos produtos com a disseminação de novas ideias propagadas pela mídia, de modo a alinhar-se ao público e caminhar para a construção de uma nova sociedade de massas, ao ideário do bloco encabeçado pelos EUA. A primeira apresentação da canção, no III Festival da Record (em 1967), colidia com os interesses e a base do governo de Costa e Silva, momento em que o país via a formação de grandes manifestações contra o abuso sistemático de força e cerceamento de liberdades, entre elas a de expressão. A música apresenta um cenário semelhante a um caleidoscópio cultural: em “...espaçonaves guerrilhas em cardinales bonitas”, a corrida espacial e os conflitos pelo mundo; em “Brigitte Bardot”, a musa pop do cinema; em “... o sol nas bancas de revistas me enche de alegria e preguiça”, a veiculação de inúmeras informações em processo de cerceamento; e em “... eu tomo uma coca- cola...” os novos hábitos de consumo.","21":"A área demarcada no mapa abrange o domínio do povo curdo em Irã, Turquia, Síria e Iraque, localizado no Oriente Médio. Trata-se da maior população apátrida do mundo, que deseja a criação de um território próprio e reconhecido como Estado, o chamado Curdistão. Porém, isso não é aceito pelos países apresentados no mapa, porque não concordam em ceder territórios para a criação do Estado curdo.","22":"Inicialmente acumuladas na região Sudeste, devido a fatores como melhor infraestrutura, concentração de capital, mercado consumidor amplo e diversificado, mão de obra imigrante e maiores investimentos governamentais e privados, as indústrias passaram nas últimas três décadas, por um processo de desconcentração por conta da oferta de incentivos fiscais praticados e concorridos entre estados e municípios brasileiros.","23":"O solo é a camada mais superficial da litosfera, resultado da interação entre processos erosivos da rocha-matriz e acúmulos de matéria orgânica. Entre os elementos fundamentais para formação dos solos, destacam-se, além da existência de matéria orgânica, os minerais, a água e o ar, que variam de acordo com os horizontes que formam as camadas do solo.","24":"A imagem mostra o fetichismo provocado pelo desejo de consumo da sociedade. No entanto, a mesma imagem mostra que o produto exige grande quantidade de água, que é consumida para produzi-lo, mas que não está apresentada na vitrine da loja. Essa é a chamada “água virtual”, mensurada pela pegada hídrica, indicador ambiental que calcula o volume de água doce utilizado ao longo de toda a cadeia de produção de um bem de consumo ou serviço.","25":"A coordenada geográfica representa, para cartografia, a localização absoluta de um determinado ponto da superfície da Terra por meio da intersecção de um meridiano e um paralelo, independentemente de qualquer localidade onde um habitante do planeta possa estar.","26":"Os pigmentos utilizados para as tatuagens atuam como antígenos (corpos estranhos) e assim estimulam o organismo a uma resposta imunológica para sua defesa.","27":"Todas as células citadas possuem em comum a presença da organela ribossomo e por isso todas têm a capacidade de sintetizar enzimas (proteínas) para seu metabolismo.","28":"O gineceu, formado pelo dobramento e fusão da folha carpelar, é dividido em três porções: estigma , estilete e ovário, onde se forma o óvulo. O cabelo do milho é o estilete do gineceu.","29":"O texto 1 explicita a ideia de modificação para adaptação (mudança proposital da cor da plumagem), típica do lamarckismo. Já o texto 2 exemplifica um caso no qual uma perturbação ambiental (incêndio) provocou uma oscilação gênica na população de lagartos. Por fim, no texto 3, observa-se uma ideia darwinista ao considerar a presença da fosseta loreal como uma característica que tende a trazer vantagem e maior chance de sobrevivência às serpentes que a possuem, sendo estas selecionadas naturalmente naquele ambiente.","30":"A abelha-rainha, por ser diploide, apresenta 32 cromossomos (2n = 32). Considerando uma meiose sem intercorrências, os óvulos formados teriam 16 cromossomos (n = 16). Porém, caso ocorra a não disjunção de um par de cromossomos homólogos, haverá formação de gametas femininos com 15 e 17 cromossomos. Logo, como os zangões são formados via partenogênese, sua constituição cromossômica poderia ser n = 15 ou n = 17.","31":"O chá é uma mistura de várias substâncias. Dessa forma, o sachê em contato com a água quente, teremos duas situações: • As substâncias que se dissolvem na água quente (extração com solvente) formarão o chá. • As substâncias que não se dissolvem na água quente são separadas por filtração (o chá passa pelos poros do sachê enquanto o resíduo sólido não passa).","32":"Massas molares provenientes da tabela periódica fornecida (para Li usaremos 6,9g/mol). Li: 6,9g/mol; Al: 27g/mol; Si: 28,1g/mol; O: 16g/mol. LiAlSi2O6: M = 186,1g/mol. 186,1g ––––––– 100% 6,9g ––––––– T ∴T \u0002 3,7%","33":"Suco de maçã: pH (2,9 a 3,3) Suco de cenoura: pH (4,9 a 5,3) Usando os valores menores de pH Suco de maçã: pH = 2,9 ∴[H+] = 10–2,9mol/L Suco de cenoura: pH = 4,9 ∴[H+]’ = 10–4,9mol/L = = 102 ∴[H+] = 100 [H+]’ Nota: usando os valores máximos de pH (3,3 e 5,3) obtém-se o mesmo resultado. Conclusão: suco de maçã é 100 vezes mais ácido que o suco de cenoura.","34":"O objeto a cobrear está no eletrodo negativo (catodo) onde ocorre a redução, de acordo com a semirreação: Cu2+(aq) + 2e– →Cu(s) Cu: M = 63,5g/mol (extraído da tabela periódica fornecida). t = 80min = 80 . 60s = 4800s i = 200mA = 200 . 10–3A = 0,2A Q = i . t ∴Q = 0,2A . 4800s = 960C Cu2+(aq) + 2e– ⎯⎯→ Cu(s) 2 . 96500C –––– 63,5g 960C –––– x x \u0002 0,3g","35":"Desidratação intramolecular (H2O é proveniente de uma molécula de álcool). Catalisador: H+ (consumido na etapa 1 e regenerado na etapa 2). C2H5OH2 +: intermediário","36":"1) Potência total das estruturas: P = 20 W + 10 W + 25 W + 7 W + 18 W 2) Energia gasta em 10 h: E = P . Δt = 80 . 10. 3600 (J) E = 288 . 104 J = 2880 kJ 3) Cálculo da massa: 700 kJ ––––––––– 50 g 2880 kJ ––––––––– m m = (g)","37":"Dilatação volumétrica da água: Sendo ΔV = A . 1 (cm3), V0 = A (H – 1) cm3, γ = 2 . 10–4°C–1 e Δθ = 35°C – 15°C = 20°C, determina- se a profundidade H. A . 1 = A (H – 1) . 2 . 10–4 . 20 ⇒ = H – 1 250 = H – 1 ⇒ H = 251 cm","38":"1.o caso: A1 = – ⇒A1 = – A imagem tem comprimento igual ao do objeto, e por ser invertida, usamos A1 = –1. A1 = ⇒–1 = –f + 40 = f ⇒ 2f = 40 2.o caso 5 + log10(10–18) = = log10 + (–18) . log1010 = = log1010 – log104 – 18 . 1 = = 1 – 2 . log102 –18 = –17 –2 . log102 = = –17 –2 . 0,301 = –17 –0,602 = –17,602"},"durationMin":300,"primary":true,"discursivePdf":"einstein2023_discursiva.pdf","discursivePages":{"1":3,"2":4,"3":5,"4":6,"5":7},"essayPage":8},{"id":"einstein2024","school":"Einstein","year":2024,"title":"Albert Einstein 2024","objectivePdf":"einstein2024_objetiva.pdf","count":50,"key":{"1":"D","2":"A","3":"E","4":"C","5":"B","6":"E","7":"A","8":"B","9":"C","10":"E","11":"B","12":"D","13":"A","14":"C","15":"C","16":"B","17":"E","18":"D","19":"E","20":"A","21":"B","22":"E","23":"C","24":"A","25":"D","26":"C","27":"D","28":"E","29":"B","30":"E","31":"A","32":"C","33":"D","34":"A","35":"B","36":"D","37":"E","38":"C","39":"A","40":"B","41":"E","42":"A","43":"D","44":"C","45":"B","46":"C","47":"E","48":"A","49":"D","50":"B"},"pages":{"1":3,"2":3,"3":3,"4":4,"5":4,"8":5,"9":5,"10":5,"6":5,"7":5,"12":6,"13":6,"11":6,"16":7,"14":7,"15":7,"18":8,"17":8,"20":9,"19":9,"23":10,"21":10,"22":10,"25":11,"24":11,"27":12,"28":12,"26":12,"31":13,"32":13,"29":13,"30":13,"34":14,"35":14,"33":14,"37":15,"36":15,"39":16,"38":16,"41":17,"42":17,"40":17,"46":18,"47":18,"43":18,"44":18,"45":18,"50":19,"48":19,"49":19},"explanations":{"1":"A intertextualidade ocorre porque a andorinha Lola, presente na tira de Laerte, “invade” a história da cachorrinha Pimpa, personagem do cartunista italiano Altan. Nota-se, portanto, uma tira que se refere a outra tira, há um diálogo entre personagens de narrativas diferentes, essa intersecção caracteriza a intertextualidade. A metalinguagem ocorre no texto em que Laerte faz explicações sobre a cochorrinha Pimpa e o autor italiano. Há o emprego do código linguístico para explicar o código da tira de Altan.","2":"Sugere-se, ironicamente, no primeiro parágrafo uma intertroca étnico- cultural, pois os yanomamis só se tornariam brancos caso estes se tornassem yanoma - mis, reciprocidade que é inexequível.","3":"A cultura e os saberes dos yanomamis são mantidos pela oralidade, pois os pensamentos “são preservados em todas as direções e nossas palavras são antigas e muitas”. O registro oral dos povos originários é contraposto ao código escrito dos brancos, que registram a linguagem “em peles de imagens para impedi-las de fugir”.","4":"O prefixo des exprime ideia de negação, como ocorre em desaparecer, desentendimento, desfeita, desmere - cimento, entre outros exemplos.","5":"A leitura da tirinha permite concluir que Derek é dissimulado, pois provavelmente comeu os filhotes e se oferece para ajudar a mãe a procurá-los.","7":"Há discurso indireto livre quando a voz do personagem mescla-se à voz do narrador. Isso ocorre no trecho em que o pensamento do doutor aparece no meio do discurso do narrador com ponto de interrogação e sem verbo de elocução: “A empregada sabia como se preparava galinha ao molho pardo?”","8":"A expressão “não só ... como (também)” imprime ao trecho ideia de adição, porque a empregada além de cortar “pescoços de galinhas” fazia isso “com uma certa alegria assassina”.","9":"Na voz passiva sintética, o objeto direto “uma rápida enquete entre os vizinhos” passa a sujeito e o verbo deve concordar com o núcleo “enquete”, ficando no singular. Há também o acréscimo do pronome apassivador “se”: Fez-se uma rápida enquete entre os vizinhos.","10":"O adjetivo “igual” rege preposição a, também é preposição o “a” entre dois verbos. Em todas as demais alternativas, trata-se de artigo pois precede substantivos.","11":"O excerto de Luís Augusto Fischer faz claras referências ao Romantismo, pois essa estética tem como núcleo de sua linguagem o sentimento do indivíduo, do artista que sofre os males de um mundo que não o compreende. Numa época de egocentrismo, como atualmente ocorre, o público leitor se identifica com essa obras em que o status quo oprime e angustia as aspirações pessoais.","13":"O fato que motivou a publicação do artigo na data específica de 23 de junho de 2023 foi a tragédia fatal que ocorreu com um navio submersível tripulado. No texto: “Rescuers spotted debris from the tourist submarine Titan on the ocean floor near the wreck of the Titanic on June 22, 2023, indicating that the vessel suffered a catastrophic failure and the five people aboard were killed.”","14":"A professora Nina Mahmoudian argumenta em favor das vantagens dos submersíveis não tripulados em expedições em alto mar de longo prazo. Lê-se a informação, principalmente em: “So, uncrewed vehicles provide better opportunities for exploration at less cost and risk in operating in inhospitable locations.”","15":"No terceiro e quarto parágrafos, as descrições do veículo remotamente operado e do veículo subaquático autônomo nos dizem que ambos são particularmente adequados para explorações não tripuladas em condições desfavoráveis. “Using remotely operated and autonomous underwater vehicles gives operators the opportunity to perform tasks that are unsafe for humans, like observing under ice and detecting underwater mines.”","16":"De acordo com o quinto parágrafo, submersíveis não tripulados têm algumas vantagens sobre os tripulados, como o fato de que os sem tripulação substituem os humanos nas tarefas de maior risco. Lê-se em: “Using remotely operated and autonomous underwater vehicles gives operators the opportunity to perform tasks that are unsafe for humans, like observing under ice and detecting underwater mines.”","17":"Tanto o anúncio quanto o texto mencionam o seguinte aspecto das expedições exploratórias: o prolongado tempo das viagens. No texto: “And covering vast areas requires tools that can work for extended periods of time, sometimes months.” No anúncio: “MEN WANTED for hazardous journey, small wages, bitter cold, long months of complete darkness, constant danger”.","18":"A teoria mais tradicional aponta que a Cultura de Clóvis (nome extraído da cidade no Novo México) possui os supostos vestígios mais antigos produzidos por ancestrais humanos na América. Contudo, o avanço das tecnologias de datação e as descobertas mais recentes de artefatos levaram diversos cientistas a questionar essa teoria, normalmente associada à Era Glacial, quando alguns agrupamentos teriam atravessado a ponte de gelo que eliminou a separação entre os continentes americano e asiático, no Estreito de Bering. Pelos novos estudos os hominídeos já estavam aqui quase o dobro do tempo defendido anteriormente.","19":"Mera interpretação de texto. O historiador Sérgio Buarque de Holanda aponta as condições climáticas e mercadológicas como determinantes para o cultivo de produtos na América.","20":"Diferentemente da América hispânica, o Brasil preservou seu território e a escravidão ao implantar, inclusive por meio da repressão aos movimentos republicanos separatistas, uma monarquia centralizada, conservadora e aristocrática.","21":"Andy Warhol foi um destacado representante da “Arte Pop”, que relacionava a expressão artística com a publicidade e o culto a celebridades, características marcantes da década de 1960.","22":"O chargista Ziraldo ironiza o governo do presidente Figueiredo, tanto na manipulação dos dados inflacionários, divulgados de forma distorcida que os mostrava sempre abaixo da realidade, como pela apresentação da Lei da Anistia (setembro de 1979), quando esta perdoou os agentes da repressão pelas mortes de opositores, mas não deu o mesmo tratamento para aqueles que lutaram contra o regime e cometeram crimes de sangue.","23":"As multinacionais deslocam-se para espaços capazes de atender seus interesses econômicos, sobretudo com a redução dos custos produtivos que aumentam seu lucro. Por outro lado, a presença de empresas no país gera arrecadação de impostos que poderia apresentar redução em tempos de guerra. A situação demonstra que, independente dos interesses políticos, os fatores econômicos podem se sobrepor em situações de conflitos, como a guerra entre Rússia e Ucrânia, em que as multinacionais permaneceram em território russo.","24":"Os gráficos mostram que a maior parte da população brasileira, mais de 115 milhões de habitantes, reside em poucos municípios (6%). Assim, é possível constatar que ocorre grandes aglomerados demográficos em alguns municípios e menores concentrações demográficas em municípios de pequeno porte, gerando disparidades na distribuição populacional.","25":"Os mapas mostram o aquecimento das águas na faixa equatorial do Oceano Pacífico (região com cores variando para o vermelho) que resulta na ocorrência do El Niño. Assim, os ventos alísios que se deslocam de leste para o oeste que deveriam provocar chuvas na costa da Ásia, Oceania e na Amazônia são enfraquecidos, alterando o local das precipitações e a temperatura do oceano com efeito no mundo todo.","26":"O desenvolvimento de novas tecnologias para a produção de eletricidade possibilita a diversificação da matriz brasileira, dando maior sustentabilidade e menor dependência em relação a energia hidrelétrica que corresponde a 58% da matriz elétrica brasileira. Cabe ressaltar que, apesar da possibilidade de aumentar a exportação de energia elétrica para os países vizinhos, o regime dos rios não é alterado. Além disso, a quantidade de energia hidrelétrica gerada não altera o consumo, os gastos e o desperdício de água já que é uma fonte renovável.","27":"Considerando que a distância entre Açailândia (MA) e Estrela d’Oeste (SP) é de 2,2 mil km e a distância máxima possível no mapa será de 16 cm, podemos concluir que: Se em 1 km, temos 100.000 cm; teremos em 2,2 mil: 1 km –––––––––––––– 100.000 cm 2.200 km –––––––––––– x x = 2.200 x 100.000 x = 220.000.000 Assim, em 16 cm do mapa, teríamos 220.000.000 cm da realidade. Logo, em cada 1cm do mapa teremos: 16cm –––––––––––– 220.000.000 1cm –––––––––––– x 16x = 220.000.000 x = 220.000.000/16 x = 13.750.000 Conclui-se que a escala do mapa será de 1:13.750.000","28":"Após análise do gráfico depreende-se que as populações 1, 2 e 3 são lontras, algas e ouriços respectivamente isto porque quando a população de lontras desaparece os ouriços, que são suas presas, cresce e, assim aumenta o consumo de alimentos (algas) levando a população de produtores ao declínio. Porém a queda no numero de algas implica na falta de alimento para os ouriços que também terá sua população reduzida.","29":"A construção de cladogramas para análises de filogenia leva em consideração a sequência de nucleotídeos de um gene, pois quanto maior a semelhança (homologia) entre sequências, maior o grau de parentesco evolutivo entre os organismos analisados. Ao contrário, diferenças na sequência de nucleotídeos entre um mesmo gene de dois ou mais organimos indica divergência evolutiva.","30":"A queda do pH sanguíneo ocorre pelo aumento da concentração de CO2, devido a sua reação com a água, o que leva a formação do ácido carbônico. Os centros respiratórios localizados no bulbo são ativados por essa queda de pH e ativam os músculos diafragma e intercostais, aumentando a frequência respiratória. Com isto, ocorre o aumento da liberação do excesso do CO2 normalizando os valores de pH sanguíneo observado no gráfico.","31":"A análise do cruzamento releva a condição de linkage dos genes e a ocorrência de crossing over durante o cruzamento da geração F1, conforme esquematizado a seguir: P: AAbb x aaBB F1: AaBb x aabb F2: Aabb (880) aaBb (880) AaBb (120) aabb (120) A taxa de permutação equivale a = 0,12 (12%) Logo, o diíbrido F1 (Ab/aB) produziu gametas AB na frequência de 6%.","32":"Considerando-se que a população esteja em equilíbrio de Wardy-Weinberg, temos a seguinte frequência gênica: F(A) = = 0,6 F(a) = = 0,4 Logo, a frequência de indivíduos com nadadeira caudal longa na geração seguinte será de: F(AA) + F(Aa) = (0,6)2 + 2 x (0,6) x (0,4) = = 0,36 + 0,48 = 0,84","33":"Filtração simples: processo de separação dos componentes de uma mistura heterogênea formada por um sólido e um líquido. Número da mistura Mistura I água + areia II leite integral III ouro 18 quilates :"C","21":"A","22":"B","23":"D","24":"E","25":"C","26":"A","27":"E","28":"B","29":"E","30":"C","31":"A","32":"D","33":"B","34":"E","35":"C","36":"A","37":"B","38":"B","39":"E","40":"D","41":"B","42":"C","43":"E","44":"D","45":"A","46":"A","47":"B","48":"A","49":"E","50":"B"},"pages":{"1":3,"2":3,"3":4,"4":4,"5":4,"9":5,"10":5,"6":5,"7":5,"8":5,"12":6,"13":6,"14":6,"11":6,"15":7,"16":7,"17":7,"18":8,"19":8,"20":8,"22":9,"23":9,"21":9,"24":10,"25":11,"26":11,"29":12,"30":12,"27":12,"28":12,"33":13,"31":13,"32":13,"34":14,"35":14,"36":14,"38":15,"37":15,"40":16,"41":16,"39":16,"44":17,"42":17,"43":17,"47":18,"45":18,"46":18,"49":19,"50":19,"48":19},"explanations":{"1":"Para obter seu efeito de humor, a tirinha explora a ambiguidade como recurso expressivo. A expressão “can you watch my stuff” pode ser entendida, no contexto, como “você pode olhar/cuidar de minhas coisas” ou “você pode assistir às minhas coisas”. No quadrinho, o garoto sem boné achou que o colega gostaria que ele cuidasse de suas coisas durante sua ausência. Entretanto, o garoto de boné queria, na verdade, mostrar-lhe um canal do YouTube.","3":"O texto mescla a voz do narrador, do pai e do filho. A primeira fala é do narrador descrevendo a atitude pensativa do pai para responder ao questionamento do filho; as duas seguintes são registros dos pensamentos do pai, no chamado discurso indireto livre, em que a fala do narrador e do personagem se misturam sem verbos dicendi ou de elocução e sem sinal de pontuação.","4":"O substantivo feixe tem o sentido de conjunto, portanto a expressão “ feixe de problemas” refere- se às varias perguntas, incômodas, sobre dúvidas gramaticais que o filho faz sequencialmente ao pai.","5":"A locução conjuntiva “desde que” estabelece relação de condição ou hipótese com a oração anterior.","6":"O termo sublinhado deve ser sujeito para que haja flexão do verbo, como é o caso de “os dois elementos”, sujeito plural que provoca a flexão no plural da forma verbal “variam”. Em todas as demais alternativas, os termos sublinhados funcionam como objeto direto dos verbos das orações.","8":"As imagens incomuns e oníricas remetem à corrente de vanguarda surrealista, que, baseada na teoria psicanalítica, busca captar o inconsciente, o mundo dos sonhos e as imagens mais profundas do ser as quais fogem da lógica aparente que preside o conceito de realidade objetiva. O nonsense e o onírico podem ser exemplificados em “Os rochedos colocam-se máscaras contra pássaros asfixiantes”, dentre outras passagens.","9":"Na vigência da censura do Estado Novo( 1937-1945), época em que foi escrito o texto Aproximação do terror, a repressão da ditadura Vargas fica mais explicita na passagem “nem tudo o que penso/Posso dizer por papel e tinta”. Nesses versos, o eu lírico reconhece o perigo de expor todas as suas ideias, pois, nesse contexto político, isso poderia causar problemas pessoais, incidindo até em prisão.","10":"Esse poema apresenta também a função metalinguística, como já se nota nos dois primeiros versos (“ Dos braços do poeta/ pende a ópera do mundo”), em que há alusão à feitura do próprio texto e à concepção de como funciona o mecanismo que rege o mundo.","11":"A única oração que admite voz passiva é a que na voz ativa apresenta verbo transitivo direto, como é o caso da forma verbal “aponta”, cujo objeto direto é “o revólver “. Na voz passiva tem-se: O revólver é apontado pela noite.","12":"O excerto de Massaud Moisés faz inequívocas referências ao Realismo, como indicam, dentre outras, as passagens “filosofia da objetividade” e o fato de os escritores dessa estética “ aderirem à ciência”. Os realistas visam ao saber positivo, proveniente da observação e da análise, opondo-se à postura subjetiva e metafísica do Romantismo.","14":"O texto aborda principalmente a adequação de programas de prevenção e intervenção direcionados a jovens usuários de mídia social. No texto: “Authors of a comprehensive new review of research on the topic say there’s still key information missing to know whether prevention programs and interventions will work.”","15":"A expressão “‘informação perfeita’”, do primeiro parágrafo, refere-se a:evidência consistente e confiável sobre um fato. No texto: “When United States (US) Surgeon General Dr. Vivek Murthy pushed for a tobacco-style warning on social media, he called the mental health crisis in young people an emergency that demanded action without waiting for “perfect information.”","16":"O estudo descrito no terceiro parágrafo foi inconclusivo quanto à correlação entre o tempo nas redes sociais e os problemas de saúde mental da população em geral. No texto: “However, the level of impact varied enough to suggest that the findings shouldn’t be generalized to the population as a whole.”","17":"De acordo com o quarto parágrafo, o uso das mídias sociais pode, potencialmente, ocupar tempo que as pessoas poderiam usar para se exercitar. No texto: “Despite potential harms — such as unhealthy social comparisons and distracting from other important healthy behaviors such as sleep, exercise and studying”","18":"É a posição explícita do autor da carta sobre os protocolos de proteção proteger crianças controlando sua liberdade de expressão é incorreto e ilegal. No texto: “This isn’t the first time the government has","20":"O excerto indica algumas atividades da nobreza guerreira medieval destacando suas habilidades militares na guerra (Cruzadas ou lutas internas entre feudos) ou em torneios (em tempos de paz), bem como afirma a supremacia do poder militar sobre os camponeses, promovendo saques das colheitas e a destruição de plantações.","21":"A gravura realizada por Frans Post, artista holandês que esteve no Nordeste do Brasil no século XVII durante o governo de Maurício de Nassau, retrata a parte de um engenho de açúcar conhecida como moenda. Essa instalação era movida pela roda de água, visível à direita da imagem, e servida pelo trabalho de numerosos escravos, representados à esquerda sobre o carro de boi e ao centro alimentando a moagem da cana. A plantation à qual fazia parte o engenho era caracterizada por ser um latifúndio, monocultor, escravista e com a produção voltada para a exportação.","22":"A obra de Pedro Bruno, de maneira simbólica, estabelece uma relação entre a figura das mulheres- mães e a nação. A bandeira, símbolo nacional fundamental, é costurada pelas mulheres, que podem ser identificadas com a Pátria. Como a mãe de todos, a Pátria oferece o cuidado, o alimento, o aconchego e o conforto necessários para assegurar o futuro da nação, representado pelo bebê colocado em primeiro plano, coberto e protegido pelo lábaro estrelado.","23":"O excerto indica em linhas muito gerais o pan- africanismo como a busca de identificação entre aqueles que foram desterrados, no período do Sistema Colonial Tradicional (séculos XVI a XVIII) e aqueles que sobreviveram à dominação neocolonialista (séculos XIX e XX) unificando épocas distintas pela opressão vivida e pela resistência oferecida. O pan- africanismo é um movimento que busca a união e a solidariedade entre os povos africanos. Surge no final do século XIX e se intensifica ao longo do século XX. Os seus defensores acreditam na importância de uma identidade africana partilhada e na luta por autonomia e direitos dos africanos. O movimento promove a cooperação política, econômica e cultural entre os países africanos e os povos fora do continente de origem (afrodiaspóricos) mobilizando o conhecimento sobre a herança e a história africana. Além disso, o pan-africanismo influenciou diversas lideranças e movimentos de independência, por exemplo: em Gana, Moçambique e na luta contra o apartheid na África do Sul.","24":"O regime de exceção foi iniciado em 1964, com a edição do Ato Institucional número 1. A Lei de Segurança Nacional, a criação do SNI (Serviço Nacional de Informação), a Constituição de 1967 e demais Atos Institucionais aparelharam o governo militar de uma estrutura de fundamentos legais para as suas práticas repressivas. Também eram utilizados artifícios de extralegalidade (prisões arbitrárias, assassínios e torturas) como meios de perseguição e de eliminação de dissidentes do regime. Nos dizeres do autor do excerto escolhido, a edição do AI-5 (13 de dezembro de 1968) rompia com essas diferentes ações e tudo dali para frente passaria a ser justificado em nome da manutenção da ordem e da segurança nacional, recorrendo o regime a práticas legais e também clandestinas.","25":"A Grande Metrópole Nacional, São Paulo, contribui para a espacialização da rede urbana e o desenvolvimento dos sistemas de transporte e de comunicação.","26":"O solo é o que mais armazena o carbono e, portanto, com a preservação dos solos, o sequestro de carbono possibilita a mitigação de mudanças climáticas.","27":"A pejotização ou PJ ocorre quando a mão de obra é contratada como “pessoa jurídica” ou PJ. Tal modalidade é incentivada pelo empregador através da doutrina econômica neoliberal.","30":"As imagens mostram que no sul e sudeste asiático quando é verão no continente, temos baixa pressão atmosférica, enquanto no Oceano Índico é inverno, portanto área com alta pressão atmosférica e despersora de ventos úmidos. Esses ventos oceânicos penetram no continente provocando altos índices pluviométricos de junho a outubro.","31":"O texto mostra a impôrtância da cartografia social que identifica a ocupação social e auxilia na demarcação de territórios em disputa.","33":"O animal mencionado no excerto pertence ao filo PLATELMINTOS e pode reproduzir-se de forma ASSEXUADA por regeneração. Ao entrar em contato com sal e vinagre, o animal morre porque PERDE ÁGUA por OSMOSE.","34":"Os hormônios no organismo humano, entre eles a irisina, são transportados pela corrente sanguínea até seus respectivos locais de ação.","35":"A Síndrome de Berardinelli caracteriza-se como uma doença autossômica recessiva rara. Logo, é maior a chance da presença deste gene raro, seja em homozigose ou heterozigose, nos indivíduos de uma mesma família. Portanto, existe nos cruzamentos consanguíneos uma maior probabilidade de que indivíduos heterozigotos portadores do gene da Síndrome de Berardinelli tenham descendentes homozigotos recessivos portadores da doença.","36":"No padrão de pelagem descritos para os gatos, as fêmeas de pelagem branca, preta e amarela são heterozigóticas e possuem o seguinte genótipo: XAXP. Esse padrão tricolor aparece em razão da inativação aleatória de um dos dois cromossomos sexuais (X) que ocorrem em cada célula da pele dessas fêmeas.","37":"A telomerase é uma enzima importante à manutenção estrutural dos cromossomos e, consequentemente, à sua longevidade, pois repõe as sequências nucleotídicas que são perdidas de suas extremidades.","38":"Ba: Z = 56 (fornecido pela tabela periódica) 131 56Ba: A = N + Z ∴ 131 = N + 56 ∴ N = 75 Meia-vida (t1/2): tempo necessário para que se desintegre a metade do número inicial dos núcleos. Atividade inicial: 1000MBq t1/2 t1/2 t1/2 1000 ––––– 500 ––––– 250 ––––– 125 36d 3t1/2 = 36d ∴ t1/2 = 12d","39":"Ânion vanadato: VO4 3– grupo 5 (metal de transição) grupo 16 (não metal) Ânion fosfato: PO4 3– grupo 15 (não metal) grupo 16 (não metal) Conclusão: somente o ânion vanadato tem um elemento metálico (V). V2O3: óxido ácido Óxido ácido + base → sal + água V2O3(s) + 6NaOH(aq) → 2Na3VO4(aq) + 3H2O(ℓ) Nota: Infelizmente houve um erro de digitação, a fórmula correta do óxido de vanádio é V2O5. V2O3 + 6NaOH → 2Na3VO4 + 3H2O 9 átomos de O 11 átomos de O V2O5 + 6NaOH → 2Na3VO4 + 3H2O 11 átomos de O 11 átomos de O A questão não precisa ser anulada, pois não pedia a fórmula do óxido e nem o balanceamento da equação.","40":"GNV: metano (CH4) V, T, M: são comuns nas duas situações PV = m ––– M RT ∴ P ––– m = R T –––– M V P1 ––– m1 = P2 –––– m2 ∴ 40 atm –––––– m1 = 160 atm ––––––––– m2","42":"1 colher medidora contém 7,5g de proteína 3 medidas: 22,5g V = 250mL = 0,250L C = m ––– V ∴ C = 22,5g –––––– 0,250L ∴ C = 90,0g/L","43":"H C 2 C H C H2 C C C H H d":"einstein2026","school":"Einstein","year":2026,"title":"Albert Einstein 2026","objectivePdf":"einstein2026_objetiva.pdf","count":50,"key":{"1":"D","2":"D","3":"E","4":"A","5":"E","6":"B","7":"C","8":"E","9":"D","10":"B","11":"A","12":"A","13":"C","14":"E","15":"D","16":"B","17":"A","18":"B","19":"C","20":"E","21":"D","22":"A","23":"D","24":"B","25":"C","26":"A","27":"B","28":"E","29":"C","30":"D","31":"E","32":"C","33":"E","34":"A","35":"B","36":"C","37":"A","38":"D","39":"D","40":"B","41":"E","42":"C","43":"D","44":"A","45":"B","46":"C","47":"E","48":"D","49":"A","50":"B"},"pages":{"1":3,"2":3,"3":3,"6":4,"7":4,"4":4,"5":4,"9":5,"10":5,"8":5,"11":6,"12":6,"13":6,"14":6,"16":7,"15":7,"19":8,"17":8,"18":8,"22":9,"20":9,"21":9,"24":10,"23":10,"26":11,"27":11,"25":11,"29":12,"28":12,"32":13,"33":13,"30":13,"31":13,"34":14,"35":14,"36":14,"37":14,"38":15,"39":15,"40":15,"41":16,"42":16,"43":16,"44":16,"45":17,"46":17,"47":17,"48":17,"49":18,"50":18},"explanations":{"1":"A árvore da tirinha comporta-se com um ser humano, tem pensamento, fica ansiosa, o que configura personificação. Já a afirmação de que “até as árvores ficam ansiosas” revela exagero, configurando uma hipérbole.","2":"Há excesso de ofertas no ambiente virtual, o que inviabiliza a realização de todas elas.","4":"Nesse texto adaptado de duas palestras e entrevistas de Aílton Krenak, o conceito de término de um modo de vida é expresso logo no primeiro período: “ O fim do mundo talvez seja uma breve interrupção de um estado de prazer extasiante que a gente não quer perder”. Essa tese será desenvolvida ao longo do texto, propondo-se que a humanidade se desconecte de “ um modo de vida que se pauta pelo prazer e pelo conforto”.","5":"Há a oposição, em várias mitologias antigas, entre relacionar a mãe Terra ao conceito de gerar a vida, associando-a portanto à figura feminina, e o de atribuir à figura masculina a atitude destrutiva, disruptiva.","6":"A palavra paraquedas metaforiza o fato de a humanidade ter de deixar atenuadamente a elevada expectativa consumista e de prazer intenso na existência. Essa alteração é uma queda em relação ao atual modo de vida, pode ser suavizada e até agradável.","7":"Ocorre anacoluto quando há interrupção do plano sintático com que se inicia a frase, alterando-lhe a sequência lógica. A construção do período deixa um ou mais termos desprendidos dos demais, geralmente depois de uma pausa sensível. Exemplo: Essas empregadas de hoje, não se pode confiar nelas. (Alcântara Machado) Isso ocorre no trecho apontado, pois o autor inicia o período enumerando elementos que causam desconforto, porém conclui com uma frase que não completa o sentido do período: “tudo isso não ficou localizado”.","8":"A expressão “do pai” tem valor adjetivo, pois está depois do substantivo “imagem” e pode ser substituída por paterno: imagem paterna.","10":"A solidão do eu lírico é expressa patentemente no terceiro e no quarto versos: “ da minha solidão/ eu te amei”. Esse amor não foi ao encontro da amada, como se nota em “ amei-te sem o saber/amando de te procurar”. Dessa impossibilidade, restou o silêncio.","11":"Ocorre derivação imprópria do verbo “crescer”, usado como substantivo no contexto: o crescer imperceptível.","12":"O Romantismo considera o sentimento e o ponto de vista pessoal como a essência do ser e da vida. O sentir impõe-se sobre o refletir. Os autores ultrarromânticos vão levar a extremos essa postura individualista, afastando-se da realidade, isolando-se muitas vezes numa atitude autodestrutiva e de impossibilidade existencial. O poema de Mia Couto já no titulo, Desencontro, indicia essa tensão irresoluta entre o ideal e o real.","14":"O texto trata principalmente sobre o experimento “Biosphere 2” (Biosfera 2) com seus pontos fracos e lições a serem aprendidas.","15":"A expressão sublinhada no trecho mencionado significa uma miniatura da Terra (uma pequena cápsula da Terra).","16":"O termo “scenery” (=cenário), sublinhado no excerto, refere-se à arquitetura inovadora do complexo da Biosfera 2.","17":"De acordo com o terceiro parágrafo, um importante desequilíbrio ecológico, que comprometeu a habitabilidade humana, foi o impacto dos níveis expandidos de dióxido de carbono.","18":"O guia informa aos potenciais visitantes do projeto da Biosfera 2 quanto tempo dura uma visita inteira.","19":"A poderosa Cartago surgiu, ela própria, como uma colônia comerciante fundada pelos fenícios no norte da África, no atual território da Tunísia. Assim como os seus fundadores, a cidade enriqueceu a partir das práticas mercantis e do contato com várias civilizações ao redor do Mediterrâneo, a mais antiga e importante ligação marítima entre o Ocidente e o Oriente. Essa grande potência marítima também estabeleceu acordos comerciais voltados para o interior do continente, na África Subsaariana, região na qual se","21":"O excerto destaca o processo de formação do Estado moderno europeu, marcado pela progressiva concentração de poderes nas mãos dos reis e pela gradual superação da fragmentação política e econômica, características do feudalismo. Essa centralização política permitiu a criação de instituições administrativas, jurídicas e fiscais sob autoridade régia e dessa maneira o absolutismo monárquico assegurou também o controle econômico do reino a partir da construção de uma unidade territorial submetida à vontade e às leis do monarca.","22":"De acordo com o excerto, os quilombos se constituíram como uma forma de resistência ao escravismo, não por empreenderem uma organização militar de enfrentamento direto à sociedade escravocrata do II Reinado, mas por ser um espaço onde negros e outros membros de grupos subalternizados viviam e livremente produziam escapando das condições de trabalho vigentes na sociedade diretamente controlada pelos homens brancos.","23":"As datas apresentadas pelo excerto da questão compreendem o processo de urbanização e industrialização vivenciados, em momentos diferentes, por diversas nações da América Latina. O acentuado êxodo rural está relacionado com a maior oferta de emprego nos centros urbanos; com o uso de maquinários agrícolas na produção rural os quais diminuíram a necessidade de trabalhadores braçais, expulsando pessoas dos campos; e, até mesmo, com a concentração fundiária, característica do modelo agroexportador.","24":"A charge expõe as tensões geradas no Brasil, durante a vigência do governo de João Goulart, quando o relativo equilíbrio entre as classes sociais construído pelo populismo não era mais possível, sobretudo diante da polarização gerada pela Guerra Fria. O presidente tentava domar os dois cavalos, que representavam as forças políticas da esquerda e da direita, cada uma exigindo suas reivindicações diante da crise econômico-financeira vivenciada pelo País, acentuada desde o último ano do governo Juscelino Kubitschek.","25":"O texto explica que a “geração roubada” corresponde às crianças aborígenes australianas que foram retiradas à força de suas famílias entre 1910 e a década de 1970, sendo enviadas para instituições ou famílias brancas com o objetivo de assimilá-las à cultura dominante. Essa política estatal provocou graves impactos sociais e culturais sobre os povos originários, uma vez que rompeu seus laços familiares, comunitários e identitários, comprometendo a transmissão de saberes, línguas e tradições. Portanto, a ação resultou no comprometimento de aspectos socioculturais dos povos originários, pois buscava apagar sua cultura e integrá-los à sociedade branca australiana.","26":"Os títulos das notícias destacam práticas industriais recentes associadas à adulteração e à perda de qualidade em produtos alimentícios — leite, azeite e café —, fenômeno que se relaciona diretamente à lógica do capitalismo de mercado, em que a busca por lucro e competitividade leva à redução de custos produtivos, mesmo que isso comprometa a","28":"A figura faz uma brincadeira com o termo inglês shifty (“instável” ou “mutável”), fazendo alusão ao fato de que as placas tectônicas estão em constante movimento. Essa instabilidade é explicada pela dinâmica interna da Terra, especialmente pelas correntes de convecção existentes no manto. Essas correntes resultam do aquecimento desigual do interior terrestre, que gera o movimento ascendente e descendente de materiais viscosos. Esse processo","30":"A Conferência das Partes (COP) reúne quase que todas as nações do mundo com o objetivo de construir acordos globais para enfrentar a crise climática. No entanto, as negociações são frequentemente marcadas por impasses e conflitos de interesse entre países desenvolvidos (grandes emissores históricos de gases do efeito estufa) e países em desenvolvimento, que demandam justiça climática e compensações financeiras para mitigar os impactos ambientais e adaptar-se a eles. Esses interesses econômicos, políticos e ambientais divergentes dificultam a","32":"A linha destacada na imagem representa o antimeridiano de Greenwich, localizado a 180° de longitude. Quando se cruza essa linha de leste para oeste, adianta-se um dia no calendário; ao cruzá-la de oeste para leste, subtrai-se um dia. Essa convenção internacional foi estabelecida para manter a coerência do tempo civil global e está intimamente relacionada à organização dos fusos horários, mas não corresponde a uma linha reta, pois sofre desvios para evitar a divisão de países e territórios. Essa linha é conhecida como Linha Internacional de Data (LID) e tem como função principal marcar a mudança da data civil no planeta.","33":"A turbina eólica utiliza os ventos para geração de energia elétrica, sendo, portanto, uma fonte de energia renovável. Essa tecnologia tem crescido rapidamente no Brasil, sobretudo nas Regiões Nordeste e Sul, onde a intensidade e a constância dos ventos favorecem sua geração. Apesar das vantagens ambientais, os parques eólicos podem causar impactos locais, especialmente ruídos gerados pelas turbinas e interferências visuais e sonoras que afetam comunidades próximas e a fauna local.","34":"A imagem apresenta um cariótipo onde o indivíduo possui 3 cópias de cada cromossomo homólogo de sua espécie, o que caracteriza uma euploidia (triploidia), uma alteração numérica dos cromossomos. Desta forma o indivíduo é 3n = 69.","35":"A gripe é uma doença cuja transmissão ocorre diretamente entre os seres humanos por meio do contato com secreções respiratórias infectadas pelo vírus Influenza. A malária é uma protozoose transmitida pela picada de um vetor, neste caso a fêmea do mosquito Anopheles. A raiva é uma virose com diversos animais silvestres fazendo o papel de reservatório da doença, cuja transmissão ocorre pelo contato com a saliva de vetores animais contaminados (exemplo: morcegos, saguis, canídeos etc.). Por fim, a febre amarela é uma virose cuja transmissão se dá pela picada de mosquitos (exemplo: Sabethes, Haemagogus ou Aedes) e que pode apresentar alguns animais silvestres como reservatórios naturais do parasita, como primatas.","36":"O processo de perda de água na forma de vapor denominado transpiração vegetal é mais intenso quando ocorre pelos estômatos e, a aplicação de","38":"A partir das informações do enunciado, temos: GENÓTIPO FENÓTIPO W _ _ _ Pelo branco wwB_ Pelo preto wwbb Pelo marrom Cruzamento: (égua pelo branco duplo heterozigótica) x (cavalo pelo marrom) ♀ WwBb x ♂ wwbb WB Wb wB wb wb WwBb Pelo branco Wwbb Pelo branco wwBb Pelo preto wwbb Pelo marrom Proporção fenotípica esperada: 2 (pelo branco) : 1 (pelo preto) : 1 (pelo marrom)","39":"Estado sólido nas duas situações: Portugal: 46,6°C S PF L PE V ––•––––––•–––––––– ––––––––––––– •–––––––––– 46,6°C 53°C 289 Santa Catarina: –10°C S PF L PE V •–––––––––•–––––––– ––––––––––––– •–––––––––– –10°C 53°C 289 Conclusão: Substância 5","40":"A dissolução do CaCl2 em água é exotérmica, pois a temperatura da água passou de 20°C para 35°C evidenciando a liberação de calor (ΔH < 0) CaCl2(s) → Ca2+(aq) + 2Cl–(aq) ΔH < 0","41":"Cálculo da concentração em mol/L de CaCl2: n = 0,1 mol, V  sua tensão nominal (Ulâmpada) em um circuito em série com um resistor (Rramo) e uma fonte de Utotal = 60 V, devemos ter: Uramo = Utotal – Ulâmpada Uramo = 60 V – Ulâmpada"},"durationMin":300,"primary":true,"discursivePdf":"einstein2026_discursiva.pdf","discursivePages":{"1":3,"2":4,"3":5,"4":6,"5":7},"essayPage":8},{"id":"sirio2025_2","school":"Sírio-Libanês","year":"2025.2","title":"Sírio-Libanês 2025.2","objectivePdf":"sirio2025_2_objetiva.pdf","count":40,"key":{"1":"E","2":"A","3":"D","4":"B","5":"E","6":"D","7":"A","8":"C","9":"B","10":"D","11":"C","12":"E","13":"A","14":"B","15":"B","16":"D","17":"C","18":"E","19":"D","20":"A","21":"E","22":"B","23":"C","24":"A","25":"B","26":"E","27":"C","28":"A","29":"B","30":"D","31":"A","32":"E","33":"B","34":"A","35":"C","36":"D","37":"A","38":"E","39":"C","40":"B"},"pages":{"1":3,"2":3,"3":3,"4":3,"5":3,"7":4,"8":4,"6":4,"11":5,"12":5,"9":5,"10":5,"15":6,"16":6,"13":6,"14":6,"18":7,"17":7,"21":8,"19":8,"20":8,"23":9,"22":9,"25":10,"24":10,"27":11,"26":11,"29":12,"28":12,"31":13,"30":13,"34":14,"32":14,"33":14,"36":15,"35":15,"38":16,"37":16,"40":17,"39":17},"durationMin":300,"primary":false},{"id":"sirio2026","school":"Sírio-Libanês","year":"2026","title":"Sírio-Libanês 2026","objectivePdf":"sirio2026_objetiva.pdf","count":40,"key":{"1":"D","2":"D","3":"C","4":"B","5":"B","6":"A","7":"D","8":"E","9":"B","10":"C","11":"A","12":"A","13":"C","14":"E","15":"D","16":"B","17":"C","18":"A","19":"E","20":"B","21":"C","22":"A","23":"D","24":"A","25":"E","26":"B","27":"C","28":"C","29":"D","30":"B","31":"A","32":"E","33":"C","34":"D","35":"B","36":"A","37":"E","38":"D","39":"C","40":"D"},"pages":{"1":3,"2":3,"3":3,"6":4,"7":4,"4":4,"5":4,"9":5,"10":5,"8":5,"13":6,"14":6,"11":6,"12":6,"16":7,"17":7,"15":7,"19":8,"18":8,"21":9,"20":9,"23":10,"22":10,"26":11,"27":11,"24":11,"25":11,"29":12,"30":12,"28":12,"31":13,"32":13,"34":14,"33":14,"36":15,"35":15,"37":16,"38":16,"40":17,"39":17},"durationMin":300,"primary":false}],"essayThemes":{"2021":{"year":2021,"theme":"O impacto da escravidão sobre o trabalho doméstico no Brasil atual","pdf":"einstein2021_discursiva.pdf","page":8,"type":"AFIRMATIVO"},"2022":{"year":2022,"theme":"A liberdade de expressão na internet: entre o direito de criticar e os impactos negativos nas pessoas","pdf":"einstein2022_discursiva.pdf","page":8,"type":"ENTRE X E Y"},"2023":{"year":2023,"theme":"A proibição é a forma mais eficaz de combater o uso de cigarros eletrônicos no Brasil?","pdf":"einstein2023_discursiva.pdf","page":8,"type":"PERGUNTA"},"2024":{"year":2024,"theme":"Imagens produzidas por inteligência artificial podem ser consideradas arte?","pdf":"einstein2024_discursiva.pdf","page":8,"type":"PERGUNTA"},"2025":{"year":2025,"theme":"Quem deve ser responsável pelos recursos financeiros para a preservação da Amazônia?","pdf":"einstein2025_discursiva.pdf","page":8,"type":"PERGUNTA"},"2026":{"year":2026,"theme":"IA e recursos hídricos: entre a sustentabilidade e o consumo excessivo","pdf":"einstein2026_discursiva.pdf","page":8,"type":"ENTRE X E Y"}},"discRubric2025":{"1":"a) Ácido úrico. (1 ponto). Não foi aceita: citar resposta certa acrescida de informação incorreta (ex.: excretam ureia e ácido úrico). Porque o fósforo é necessário na composição / formação / produção de ATP, molécula que reserva energia. (1 ponto) Foram aceitas: faz parte da estrutura do ATP; síntese de ATP; trifosfato de adenosina; adenosina trifosfato; ADP; ADP+P. Não foram aceitas: citar que participa / atua / faz parte da respiração celular ou fosforilação oxidativa ou transporte de energia sem citar o ATP. b) Os nutrientes ingressam nos produtores por meio da absorção / assimilação / captação realizada pelas raízes das plantas. (1 ponto) Foram aceitas: penetram; ingressam; entram pelas raízes; zona pilífera; estruturas e regiões radiculares. Não foram aceitas: citar somente absorção sem citar o órgão vegetal; citar processo de fixação por bactérias sem citar resposta correta (raízes); citar apenas micorrizas. As aves não conseguem obter toda a energia dos alimentos consumidos porque não conseguem digerir / absorver / metabolizar / processar / assimilar todos os alimentos, e grande parte é perdida nas fezes / excretas. (1 ponto) Foram aceitas: citar adaptações anatômicas ao voo (bico córneo, perda dos dentes, ausência de bexiga urinária, redução de peso, rápida passagem pelo organismo, sistema digestório mais simples / curto / menos completo / eficiente, menos tempo digerindo); citar que consomem apenas o necessário e excretam / descartam o restante. Não foram aceitas: citar apenas eliminado / excretado / descartado nas fezes; citar explicações com enzimas e celulose. ou As aves não conseguem obter toda a energia dos alimentos consumidos porque parte da energia já foi dissipada / convertida em forma de calor para o ambiente ou parte foi utilizada / usada / liberada / catabolizada nos processos metabólicos pelo organismo que a ave consumiu. Portanto, a energia é transferida de forma unidirecional e decrescente ao longo da cadeia alimentar / energética. (1 ponto) Foram aceitas: citar processos metabólitos (respiração, digestão, voo, para se manter vivo, para seu aquecimento / endotermia); citar que a energia vai diminuindo / dissipando / reduzindo / decrescendo conforme aumenta os níveis tróficos; citar que apenas 10% da energia é transferida para o consumidor; citar diferença energética entre PPB e PPL, em que parte é gasta na respiração. Não foram aceitas: citar apenas dissipado; dissipado para o ambiente. Faculdade Israelita de Ciências da Saúde Albert Einstein Vestibular 2025 | Administração, Enfermagem, Engenharia Biomédica, Fisioterapia, Medicina, Nutrição e Odontologia","2":"a) Nessas condições, o composto 1 apresenta-se no estado líquido. (1 ponto) O composto 2 pertence à função orgânica ácido carboxílico. (1 ponto) b) (1 ponto) Fórmula molecular do composto formado: C5H10O2 (1 ponto)","3":"a) Com a equação apresentada no enunciado, T = 2,04 ∙√L, é possível calcular o período do movimento pendular: T = 2,04 ∙√L = 2,04 ∙√64 T = 16,32 s (1 ponto) Para que a pessoa, partindo do ponto A, atinja o ponto B pela primeira vez, corresponde a um quarto do período de oscilação do pêndulo, logo: Δt = T 4 = 16,32 4 Δt = 4,08 s (1 ponto) b) A pessoa está em movimento circular e apresenta apenas aceleração centrípeta. Na posição B, as forças que atuam sobre a pessoa são as forças peso e tração no fio, que não se anulam. Aplicando o princípio fundamental da dinâmica: RC = m ∙aC ⟹ T −P = m ∙ vB 2 R ⟹ T −m ∙g = m ∙ vB 2 R ⟹ 840 −60 ∙10 = 60 ∙ vB 2 64 ⟹ ⟹ 240 = 60 ∙ vB 2 64 ⟹ vB 2 = 256 vB = 16 m/s (1 ponto) O sistema é conservativo, a energia mecânica é conservada em cada ponto do trajeto, então: Emec A = Emec B ⟹ Ecin A + Epot A = Ecin B + Epot B Partindo do repouso, ponto A, e adotando o ponto B como nível de referência para o cálculo da altura, tem-se que Ecin A = 0 e Epot B = 0. Assim: Epot A = Ecin B ⟹ m ∙g ∙hA = m ∙ vB 2 2 ⟹ g ∙ hA = vB 2 2 ⟹ ⟹ hA = vB 2 2 ∙ g ⟹ hA = 162 2 ∙ 10 ⟹ hA = 12,8 m (1 ponto) Faculdade Israelita de Ciências da Saúde Albert Einstein Vestibular 2025 | Administração, Enfermagem, Engenharia Biomédica, Fisioterapia, Medicina, Nutrição e Odontologia","4":"a) Calcular corretamente a soma dos números das faces opostas do dado incomum, ou seja: −4 + (−3) + (−2) + (−1) + 0 + 1 3 = −3 Assim, as faces opostas no dado incomum são: –4 e 1; –3 e 0; –2 e –1. (1 ponto) Em seguida, mostrar por meio de cálculo, que há 8 formas de inscrever os outros números no dado incomum, ou seja: Para preencher a face a há 4 possibilidades, assim, para a face b há apenas 1 possibilidade, e para a face c há duas possibilidades, assim para a face d há apenas 1 possibilidade: total = 4 · 1 · 2 · 1 = 8 formas. (1 ponto) Pode-se mostrar a quantidade de formas fazendo a listagem explícita, assim: b) Cálculo dos casos favoráveis e do espaço amostral, por meio de tabela: 𝟏 𝟐 𝟑 𝟒 𝟓 𝟔 −𝟒 −3 −2 −1 0 1 2 −𝟑 −2 −1 0 1 2 3 −𝟐 −1 0 1 2 3 4 −𝟏 0 1 2 3 4 5 𝟎 1 2 3 4 5 6 𝟏 2 3 4 5 6 7 Casos favoráveis (valores em azul): 2 + 3 + 4 + 5 + 6 + 6 = 26 possibilidades Espaço amostral = 6 · 6 = 36 possibilidades Probabilidade = Casos Favoráveis Espaço Amostral = 26 36 (1 ponto) (1 ponto) Faculdade Israelita de Ciências da Saúde Albert Einstein Vestibular 2025 | Administração, Enfermagem, Engenharia Biomédica, Fisioterapia, Medicina, Nutrição e Odontologia Outra opção: Cálculo da probabilidade de pelo menos três possíveis jogadas dos dados, como na tabela abaixo: Face do dado incomum Face do dado comum Probabilidade -4 5 ou 6 1 6 ∙2 6 = 2 36 -3 4, 5 ou 6 1 6 ∙3 6 = 3 36 -2 3, 4, 5 ou 6 1 6 ∙4 6 = 4 36 -1 2, 3, 4, 5 ou 6 1 6 ∙5 6 = 5 36 0 1, 2, 3, 4, 5, ou 6 1 6 ∙6 6 = 6 36 1 1, 2, 3, 4, 5, ou 6 1 6 ∙6 6 = 6 36 Não foi aceita: resposta que apresentou apenas o resultado, sem apresentação de como se chegou a ele.","5":"a) O propósito da China era coletar amostras do lado oculto da Lua. (1 ponto) Foram aceitas: reunir/juntar/pegar materiais/pedaços do solo/rochas no lado escuro/no lado distante/no lado não visível/do outro lado da Lua. Não foram aceitas: o propósito era ocupar uma estação espacial; tocar a Lua; pousar na Lua; chegar na Lua; desafiar a dominância dos EUA no espaço. O objetivo mais imediato dos EUA no espaço é levar astronautas de volta à superfície lunar. (1 ponto) Foram aceitas: realizar um voo com quatro astronautas ao redor da Lua em 2025; aterrissar pessoas em solo lunar no ano de 2026. Não foram aceitas: o objetivo foi enviar uma missão para o espaço; manter a hegemonia no espaço, ocupar uma estação espacial, retornar seus astronautas do espaço para a Terra; continuar à frente do rival. b) A coalisão é importante para os EUA a fim de pressionar o programa espacial chinês a revelar informações, eliminando suspeitas de que o país realiza operações secretas e militares na órbita lunar. (1 ponto) Foram aceitas: para garantir que a China não está realizando missões espaciais secretas ou militares; pois existem suspeitas de que a China realiza operações espaciais secretas e militares. Não foram aceitas: para manter a hegemonia/dominância/liderança dos EUA; para ajudar os EUA na corrida espacial; para que os EUA não fiquem atrás da China; para que EUA e China coexistam no espaço; porque existe uma competição entre China e EUA. O texto cita, ao todo, quatro compromissos que devem ser assumidos pelos países signatários: (i) submeter-se a normas de comportamento no espaço, na superfície da Lua e ao redor dela, (ii) compartilhar descobertas científicas, (iii) detalhar onde estão operando na superfície lunar e (iv) detalhar exatamente o que estão fazendo. (1 ponto) Foi aceita: os países devem ser transparentes em suas operações espaciais."},"resources":[{"title":"Edital Einstein 2027","file":"edital_einstein_2027.pdf"},{"title":"Critérios de redação Einstein 2025","file":"criterios_redacao_einstein_2025.pdf"},{"title":"Critérios das discursivas Einstein 2025","file":"criterios_discursivas_einstein_2025.pdf"},{"title":"Guia de redação","file":"guia_redacao.pdf"},{"title":"Análise histórica enviada","file":"analise_historica.pdf"}],"complementaryDiscursive":[{"title":"Sírio-Libanês 2025.2 - 8 discursivas","file":"sirio2025_2_discursiva.pdf"},{"title":"Sírio-Libanês 2026 - 8 discursivas","file":"sirio2026_discursiva.pdf"},{"title":"FAMEMA 2024 - discursivas","file":"famema2024_discursiva.pdf"},{"title":"FAMEMA 2025 - discursivas","file":"famema2025_discursiva.pdf"},{"title":"FAMEMA 2026 - discursivas","file":"famema2026_discursiva.pdf"}]};</script>
<script>
const KEY='evolucao_einstein_2027_independente_v1';
const STAGES=['Teoria','Questões','Corrigido','Erros revisados','Rev. 24h','Rev. 7d','Rev. final','Dominado'];
const ERRORS={A:'Não sabia o conteúdo',B:'Confundi conceitos',C:'Interpretação',D:'Falta de atenção',E:'Gráfico/tabela/esquema',F:'Resposta incompleta',G:'Resposta vaga/imprecisa'};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function fresh(){return{examDate:APP_DATA.examDate,target:APP_DATA.target,study:{},examRuns:{},history:[],errors:[],essays:[],streak:{last:null,count:0},settings:{}}}
let S;try{S={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')} }catch(e){S=fresh()}
function save(){localStorage.setItem(KEY,JSON.stringify(S));touch();}
function touch(){const d=new Date().toISOString().slice(0,10);if(S.streak.last!==d){if(S.streak.last){let p=new Date(S.streak.last);p.setDate(p.getDate()+1);S.streak.count=(p.toISOString().slice(0,10)===d)?(S.streak.count||0)+1:1}else S.streak.count=1;S.streak.last=d;localStorage.setItem(KEY,JSON.stringify(S));}$('#streak').textContent='🔥 '+(S.streak.count||0)+' dias'}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function pct(a,b){return b?Math.round(100*a/b):0}function fmtTime(ms){let s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`}
function daysLeft(){let d=new Date(S.examDate+'T12:00:00'),n=new Date();return Math.max(0,Math.ceil((d-n)/86400000))}
function subjectStats(){let out={};APP_DATA.subjects.forEach(x=>out[x]={ok:0,total:0});S.history.filter(h=>h.type==='objective').forEach(h=>{Object.entries(h.subject||{}).forEach(([k,v])=>{if(out[k]){out[k].ok+=v.ok;out[k].total+=v.total}})});return out}
function studyStats(){let total=0,done=0,by={};for(const [sub,blocks] of Object.entries(APP_DATA.content)){by[sub]={total:0,done:0};blocks.forEach((b,bi)=>b.items.forEach((it,ii)=>{total++;by[sub].total++;let key=`${sub}|${bi}|${ii}`;let st=S.study[key]||[];if(st.includes('Dominado')){done++;by[sub].done++;}}))}return{total,done,by}}
function reviewDue(){let now=Date.now(),r=[];S.errors.forEach(e=>{let t=new Date(e.date).getTime();let d=(now-t)/86400000;if((d>=1&&!e.rev24)||(d>=7&&!e.rev7))r.push(e)});return r}
function priorityList(){let arr=[];let stats=subjectStats();for(const [sub,blocks] of Object.entries(APP_DATA.content)){if(!APP_DATA.subjects.includes(sub))continue;let acc=stats[sub].total?stats[sub].ok/stats[sub].total:.65;blocks.forEach((b,bi)=>{let items=b.items.length||1,dom=0;b.items.forEach((it,ii)=>{if((S.study[`${sub}|${bi}|${ii}`]||[]).includes('Dominado'))dom++});let prog=dom/items;let score=(b.weight||1)*(1-prog)*(1.15-acc);arr.push({sub,title:b.title,score,prog,acc,weight:b.weight||1})})}return arr.sort((a,b)=>b.score-a.score).slice(0,5)}
function renderHome(){let st=studyStats(),ss=subjectStats(),hist=S.history.filter(x=>x.type==='objective'),last=hist.at(-1);let essays=S.essays.filter(x=>x.score!=null);let avgEssay=essays.length?(essays.reduce((a,b)=>a+b.score,0)/essays.length):null;$('#countdown').textContent=`${daysLeft()} dias para a prova • ${new Date(S.examDate+'T12:00:00').toLocaleDateString('pt-BR')}`;let pri=priorityList();let recent=hist.slice(-8);let points=recent.map((h,i)=>({x:i,y:h.percent||0}));let svg='';if(points.length>1){let coords=points.map((p,i)=>`${10+i*(280/(points.length-1))},${78-p.y*.65}`).join(' ');svg=`<svg class="spark" viewBox="0 0 300 90"><polyline fill="none" stroke="currentColor" stroke-width="3" points="${coords}"/>${points.map((p,i)=>`<circle cx="${10+i*(280/(points.length-1))}" cy="${78-p.y*.65}" r="3.5" fill="currentColor"/>`).join('')}</svg>`}
$('#home').innerHTML=`<div class="card"><div class="row wrap"><div><div class="small muted">CONTEÚDO DOMINADO</div><div style="font-size:40px;font-weight:950">${pct(st.done,st.total)}%</div><div class="small muted">${st.done}/${st.total} subassuntos</div></div><div style="flex:1;min-width:190px;max-width:480px"><div class="bar"><div class="fill" style="width:${pct(st.done,st.total)}%"></div></div><div class="small muted" style="margin-top:7px">Teoria → Questões → Correção → Erros → Revisões → Dominado</div></div></div></div>

function startExam(id,mode){let e=APP_DATA.exams.find(x=>x.id===id);if(!e)return;let key=id+(mode==='full'?'_full':'');let r=S.examRuns[key];if(!r||r.finished){r={id:key,examId:id,mode,count:e.count,answers:{},flags:{},confidence:{},disc:{},essay:'',pos:1,start:Date.now(),elapsed:0,finished:false};S.examRuns[key]=r;save()}SIM={e,r,key,screen:'objective'};if(mode==='full'&&r.pos>e.count){SIM.screen=r.pos<=e.count+5?'disc':'essay'};$('#simOverlay').classList.add('on');renderSim();clearInterval(timerInt);timerInt=setInterval(()=>{if(SIM&&!SIM.r.finished){$('#simTime')&&($('#simTime').textContent=fmtTime(SIM.r.elapsed+(Date.now()-SIM.r.start))) }},1000)}

function finishExam(){if(!SIM)return;if(!confirm('Finalizar? Depois disso o gabarito será liberado.'))return;let {e,r}=SIM,key=SIM.key;let score=0,subject={};APP_DATA.subjects.forEach(s=>subject[s]={ok:0,total:0});for(let q=1;q<=e.count;q++){let ok=r.answers[q]===e.key[q];if(ok)score++;let sub=e.school==='Einstein'?subjectFor(q):'Complementar';if(subject[sub]){subject[sub].total++;if(ok)subject[sub].ok++}}r.elapsed=currentElapsed();r.finished=true;r.score=score;r.percent=pct(score,e.count);save();S.history.push({type:'objective',id:key,title:e.title,score,count:e.count,percent:r.percent,date:new Date().toISOString(),subject,elapsed:r.elapsed});save();clearInterval(timerInt);showResult(e,r)}

function showResult(e,r){let wrong=[];for(let q=1;q<=e.count;q++)if(r.answers[q]!==e.key[q])wrong.push(q);$('#simHead').innerHTML=`<div class="row"><div><b>Resultado • ${esc(e.title)}</b><div class="small muted">Tempo ${fmtTime(r.elapsed)}</div></div><button class="btn primary" onclick="closeResult()">Concluir</button></div>`;let subj='';if(e.school==='Einstein'){let h=S.history.at(-1);subj=`<div class="grid g4">${APP_DATA.subjects.map(s=>{let x=h.subject[s],a=x.total?pct(x.ok,x.total):0;return `<div class="stat"><span class="small muted">${s}</span><b>${x.ok}/${x.total}</b><span class="small">${a}%</span></div>`}).join('')}</div>`}$('#simBody').innerHTML=`<div class="card"><div class="scoreBig">${r.score}/${e.count}</div><div class="muted">${r.percent}% de acerto</div><div class="bar" style="margin-top:10px"><div class="fill" style="width:${r.percent}%"></div></div></div>${subj}${r.mode==='full'?`<div class="card"><b>Prova II</b><div class="small muted" style="margin-top:5px">As 5 discursivas e a redação ficam salvas para correção guiada. A objetiva foi corrigida automaticamente.</div>${e.year==2025?'<button class="btn secondary" style="margin-top:9px" onclick="openDiscReview2025()">Corrigir discursivas 2025</button>':''}</div>`:''}<div class="sectionTitle"><h2>Questões para revisar</h2></div><div class="card">${wrong.length?wrong.map(q=>`<div class="reviewItem"><div class="row wrap"><b>Questão ${q} • ${e.school==='Einstein'?subjectFor(q):'Complementar'}</b><span class="pill bad">Você: ${r.answers[q]||'em branco'} • Gabarito: ${e.key[q]}</span></div>${e.explanations?.[q]?`<div class="small muted" style="margin-top:7px">${esc(e.explanations[q])}</div>`:''}<button class="btn secondary" style="margin-top:8px" onclick="classifyError('${e.id}',${q})">Classificar erro</button></div>`).join(''):'<div class="good pill">Prova sem erros 🎉</div>'}</div>`;$('#simPrev').classList.add('hidden');$('#simNext').classList.add('hidden');$('#simFlag').classList.add('hidden')}

function classifyError(examId,q){let e=APP_DATA.exams.find(x=>x.id===examId),sub=e.school==='Einstein'?subjectFor(q):'Complementar';let type=prompt('Tipo de erro: A conteúdo, B confusão, C interpretação, D atenção, E gráfico/tabela/esquema','A');if(!type||!ERRORS[type.toUpperCase()])return;let note=prompt('Qual foi o microerro / como evitar na próxima?','')||'';S.errors.push({id:Date.now()+'_'+q,date:new Date().toISOString(),examId,q,subject:sub,type:type.toUpperCase(),note,rev24:false,rev7:false});save();alert('Erro salvo para revisão.');renderErrors()}
