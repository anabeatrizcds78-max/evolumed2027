function strategy(type){if(type==='PERGUNTA')return '<b>Pergunta:</b> a tese deve responder diretamente à pergunta. D1 e D2 justificam a resposta; a conclusão retoma a resposta.';if(type==='ENTRE X E Y')return '<b>Entre X e Y:</b> apresente a tensão, tome posição (ou estabeleça condições), defenda-a e trabalhe o contraponto sem perder a tese.';return '<b>Afirmativo:</b> transforme a afirmação em problema, concorde/discorde/qualifique e construa uma tese específica.'}
let essayTimer=null,essayStart=0,activeEssay=null;function renderEssay(){let hist=S.essays;$('#essay').innerHTML=`<div class="sectionTitle"><div><div class="small muted">CORRETOR VUNESP</div><h2>Redação</h2></div><span class="pill blue">A/B/C/D → /20</span></div><div class="notice">A correção local é uma <b>estimativa pedagógica</b>. Ela aplica regras objetivas da rubrica e sinais de estrutura/coesão, mas não substitui a leitura semântica de um corretor humano ou de uma integração segura com IA.</div><div class="sectionTitle"><h2>Propostas antigas</h2></div>${Object.values(APP_DATA.essayThemes).sort((a,b)=>b.year-a.year).map(t=>`<div class="card"><div class="row wrap"><div><b>Einstein ${t.year}</b><div class="small muted" style="margin-top:4px">${esc(t.theme)}</div></div><span class="pill">${t.type}</span></div><div class="examActions" style="margin-top:10px"><button class="btn secondary" onclick="openEssay(${t.year},'train')">Modo treino</button><button class="btn primary" onclick="openEssay(${t.year},'test')">Modo prova</button></div></div>`).join('')}<div class="sectionTitle"><h2>Histórico</h2></div><div class="card">${hist.length?hist.slice().reverse().map(x=>`<div class="resource"><div><b>${x.year} • ${x.score.toFixed(1)}/20</b><div class="small muted">A ${x.A}/3 • B ${x.B}/4 • C ${x.C}/4 • D ${x.D}/3 • ${new Date(x.date).toLocaleDateString('pt-BR')}</div></div><span class="pill ${x.score>=17?'good':x.score>=14?'warn':'bad'}">${x.type}</span></div>`).join(''):'Nenhuma redação corrigida ainda.'}</div>`}
function openEssay(year,mode){let th=APP_DATA.essayThemes[year];activeEssay={th,mode,text:'',start:Date.now()};$('#simOverlay').classList.add('on');$('#simPrev').classList.add('hidden');$('#simFlag').classList.add('hidden');$('#simNext').classList.add('hidden');$('#simHead').innerHTML=`<div class="row wrap"><div><b>Redação Einstein ${year}</b><div class="small muted">${mode==='train'?'Modo treino':'Modo prova'} • <span id="essayTime">00:00:00</span></div></div><button class="btn secondary" onclick="closeEssay()">Fechar</button></div>`;$('#simBody').innerHTML=`<div class="card pdfbox"><iframe src="${pdfSrc(th.pdf,th.page)}"></iframe></div>${mode==='train'?`<div class="card strategy">${strategy(th.type)}</div><div class="card"><h2>Projeto de texto</h2><div class="grid g2 form"><label>Tese<input id="projTese" placeholder="Minha posição..."></label><label>Argumento 1<input id="projA1" placeholder="Por quê?"></label><label>Argumento 2<input id="projA2" placeholder="Por quê?"></label><label>Repertório<input id="projRep" placeholder="Como comprova o argumento?"></label></div></div>`:''}<div class="card"><div class="row wrap"><h2>Texto</h2><span class="pill blue">${th.type}</span></div><textarea id="essayText" class="textArea" placeholder="Escreva aqui..." oninput="activeEssay.text=this.value;lineInfo(this.value,'essayInfo')"></textarea><div class="small muted" id="essayInfo"></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="correctEssay()">Entregar e corrigir</button></div>`;clearInterval(essayTimer);essayTimer=setInterval(()=>{$('#essayTime')&&($('#essayTime').textContent=fmtTime(Date.now()-activeEssay.start))},1000)}
function lineInfo(t,id){let words=t.trim()?t.trim().split(/\s+/).length:0;let lines=Math.max(t.split('\n').filter(x=>x.trim()).length,Math.ceil(words/10));let el=document.getElementById(id);if(el)el.textContent=`≈ ${lines} linhas • ${words} palavras`}
function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ')}
function essayScore(text,th){let n=normalize(text),words=n.split(/\s+/).filter(Boolean),paras=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);let estLines=Math.max(paras.length,Math.ceil(words.length/10));let stops=new Set('a o os as de da do das dos e em um uma para por com que se no na nos nas ao aos ou como mais sobre ser sua seu suas seus entre'.split(' '));let themeWords=normalize(th.theme).split(/\s+/).filter(w=>w.length>4&&!stops.has(w));let overlap=themeWords.filter(w=>n.includes(w)).length/Math.max(1,themeWords.length);let A=overlap>.55?3:overlap>.30?2:overlap>.12?1:0;if(th.year==2025){let g1=/amazon|florest|meio ambiente/.test(n),g2=/recurso|financ|dinheir|investiment/.test(n),g3=/respons|governo|estado|empresa|setor privado|sociedade|internacional/.test(n);A=g1&&g2&&g3?3:(g1&&g2)||(g2&&g3)||(g1&&g3)?2:(g1||g2)?1:0}
let first=normalize(paras[0]||'');let stance=/(deve|devem|nao deve|e necessario|e fundamental|pode|podem|embora|portanto|defende|responsavel)/.test(first);let badPerson=/(\beu\b|minha opiniao|eu acho|eu acredito|voce|voces)/.test(n);let collection=/(texto 1|texto i|coletanea|proposta de redacao|como solicitado)/.test(n);let dev=paras.slice(1,-1).filter(p=>p.split(/\s+/).length>=45).length;let B=(paras.length>=4&&stance&&dev>=2?4:paras.length>=3&&stance?3:paras.length>=2?2:1);if(badPerson||collection)B=Math.min(B,3);
let informal=(n.match(/\b(pra|ta|ne|tipo|mano|galera)\b/g)||[]).length;let odd=(text.match(/\s+[,.!?;:]/g)||[]).length+(text.match(/[!?]{2,}/g)||[]).length;let C=(informal+odd===0?4:informal+odd<=2?3:informal+odd<=5?2:1);if(estLines<=20)C=Math.min(C,3);if(estLines<=15)C=Math.max(1,C-1);
let connectors=['alem disso','portanto','entretanto','contudo','nesse sentido','assim','por conseguinte','todavia','embora','desse modo','dessa forma','em contrapartida','logo'];let used=connectors.filter(c=>n.includes(c));let repeats=connectors.map(c=>(n.match(new RegExp(c,'g'))||[]).length).filter(x=>x>=3).length;let D=(paras.length>=4&&used.length>=3&&repeats===0?3:paras.length>=3&&used.length>=1?2:1);if(estLines<=20)D=Math.min(D,2);if(estLines<=15)D=Math.max(1,D-1);let issues=[];if(A<3)issues.push('Tema não aparece de forma completa/inequívoca.');if(!stance)issues.push('Tese pouco explícita na introdução.');if(dev<2)issues.push('Um ou mais argumentos parecem pouco desenvolvidos.');if(badPerson)issues.push('Uso de 1ª/2ª pessoa pode limitar o critério B.');if(collection)issues.push('Referência direta à coletânea/situação de prova pode limitar B.');if(informal)issues.push('Há marcas de informalidade.');if(repeats)issues.push('Há repetição excessiva de um mesmo conectivo.');if(estLines<=20)issues.push('Com 20 linhas ou menos, C e D não alcançam a nota máxima.');if(estLines<=7)issues=['Risco de nota zero: 7 linhas ou menos.'];let raw=A+B+C+D,score=estLines<=7?0:raw*20/14;return{A,B,C,D,raw,score,issues,lines:estLines,words:words.length}}
function correctEssay(){let text=activeEssay.text||'';if(!text.trim()){alert('Escreva a redação antes de entregar.');return}let sc=essayScore(text,activeEssay.th);let rec={year:activeEssay.th.year,type:activeEssay.th.type,text,date:new Date().toISOString(),...sc};S.essays.push(rec);save();clearInterval(essayTimer);$('#simHead').innerHTML=`<div class="row"><div><b>Correção estimada • Einstein ${rec.year}</b><div class="small muted">Rubrica VUNESP A/B/C/D</div></div><button class="btn primary" onclick="closeEssay()">Concluir</button></div>`;$('#simBody').innerHTML=`<div class="card"><div class="scoreBig">${rec.score.toFixed(1)}/20</div><div class="muted">Nota bruta ${rec.raw}/14</div></div><div class="criteria"><div class="stat"><span class="small muted">A • Tema</span><b>${rec.A}/3</b></div><div class="stat"><span class="small muted">B • Estrutura</span><b>${rec.B}/4</b></div><div class="stat"><span class="small muted">C • Língua</span><b>${rec.C}/4</b></div><div class="stat"><span class="small muted">D • Coesão</span><b>${rec.D}/3</b></div></div><div class="sectionTitle"><h2>O que está travando sua nota?</h2></div><div class="card">${rec.issues.length?rec.issues.map(x=>`<div class="reviewItem">⚠️ ${esc(x)}</div>`).join(''):'<span class="pill good">Nenhum travador objetivo detectado</span>'}</div><div class="card notice"><b>Limite desta correção:</b> o app consegue aplicar regras estruturais e sinais linguísticos objetivos, mas não julga com segurança profundidade argumentativa, pertinência real de repertório ou todos os desvios gramaticais. A nota é uma estimativa de treino.</div><button class="btn secondary" onclick="rewriteEssay()">Reescrever esta redação</button>`}
function rewriteEssay(){let old=activeEssay.text,th=activeEssay.th;openEssay(th.year,'train');setTimeout(()=>{let t=$('#essayText');t.value=old;activeEssay.text=old;lineInfo(old,'essayInfo')},50)}function closeEssay(){clearInterval(essayTimer);$('#simOverlay').classList.remove('on');$('#simPrev').classList.remove('hidden');$('#simFlag').classList.remove('hidden');$('#simNext').classList.remove('hidden');activeEssay=null;renderEssay();renderHome()}
function renderErrors(){let counts={A:0,B:0,C:0,D:0,E:0,F:0,G:0};S.errors.forEach(e=>counts[e.type]=(counts[e.type]||0)+1);let due=reviewDue();$('#errors').innerHTML=`<div class="sectionTitle"><div><div class="small muted">DIAGNÓSTICO</div><h2>Meus erros</h2></div></div><div class="errorGrid">${Object.keys(ERRORS).map(k=>`<div class="errorBox"><b>${counts[k]}</b>${k}<div class="small muted">${ERRORS[k]}</div></div>`).join('')}</div><div class="sectionTitle"><h2>Revisões pendentes</h2><span class="pill ${due.length?'warn':''}">${due.length}</span></div><div class="card">${due.length?due.map(e=>`<div class="reviewItem"><div class="row wrap"><div><b>${e.subject} • ${e.examId||''} Q${e.q}</b><div class="small muted">${e.type} — ${ERRORS[e.type]}${e.note?' • '+esc(e.note):''}</div></div><div><button class="btn secondary" onclick="markReview('${e.id}','rev24')">24h ✓</button> <button class="btn secondary" onclick="markReview('${e.id}','rev7')">7d ✓</button></div></div></div>`).join(''):'Nenhuma revisão vencida.'}</div><div class="sectionTitle"><h2>Histórico de erros</h2></div><div class="card">${S.errors.length?S.errors.slice().reverse().map(e=>`<div class="reviewItem"><b>${e.type} • ${e.subject} • Q${e.q}</b><div class="small muted">${esc(e.note||ERRORS[e.type])}</div></div>`).join(''):'Nenhum erro classificado ainda.'}</div>`}
function markReview(id,k){let e=S.errors.find(x=>x.id===id);if(e)e[k]=true;save();renderErrors();renderHome()}
function renderSettings(){$('#settings').innerHTML=`<div class="sectionTitle"><div><div class="small muted">CONFIGURAÇÃO</div><h2>Ajustes e backup</h2></div></div><div class="card form"><label>Data da prova<input type="date" id="setDate" value="${S.examDate}"></label><label style="display:block;margin-top:10px">Meta de acerto (%)<input type="number" min="1" max="100" id="setTarget" value="${S.target}"></label><button class="btn primary" style="margin-top:12px" onclick="saveSettings()">Salvar</button></div><div class="sectionTitle"><h2>Backup</h2></div><div class="card"><div class="grid g2"><button class="btn secondary" onclick="exportData()">Exportar backup JSON</button><label class="btn secondary" style="text-align:center">Importar backup<input class="hidden" type="file" accept="application/json" onchange="importData(this.files[0])"></label></div></div><div class="sectionTitle"><h2>Materiais de referência</h2></div><div class="card">${APP_DATA.resources.map(r=>`<div class="resource"><b>${esc(r.title)}</b><a target="_blank" class="btn secondary" href="${r.file}">Abrir</a></div>`).join('')}</div><div class="card"><b>Sobre a correção automática de redação</b><div class="small muted" style="margin-top:5px">Esta versão faz correção local estimada. Uma correção semântica de nível banca (tese, qualidade dos argumentos e repertório) precisa de um serviço de IA em servidor seguro; uma chave privada não deve ficar exposta no GitHub Pages.</div></div><button class="btn danger" onclick="resetAll()">Apagar todos os meus dados</button>`}
function saveSettings(){S.examDate=$('#setDate').value;S.target=Number($('#setTarget').value)||80;save();renderAll()}function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='evolucao-einstein-2027-backup.json';a.click();URL.revokeObjectURL(u)}function importData(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{S={...fresh(),...JSON.parse(r.result)};save();renderAll();alert('Backup restaurado.')}catch(e){alert('Arquivo inválido.')}};r.readAsText(f)}function resetAll(){if(confirm('Apagar todo o progresso, provas, redações e erros?')){localStorage.removeItem(KEY);S=fresh();renderAll()}}
function showTab(id){$$('.tab').forEach(x=>x.classList.toggle('active',x.id===id));$$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));window.scrollTo({top:0})}$$('.nav button').forEach(b=>b.onclick=()=>{showTab(b.dataset.tab);if(b.dataset.tab==='study')renderStudy();if(b.dataset.tab==='tests')renderTests();if(b.dataset.tab==='essay')renderEssay();if(b.dataset.tab==='errors')renderErrors();if(b.dataset.tab==='settings')renderSettings()});
function renderAll(){touch();renderHome();renderStudy();renderTests();renderEssay();renderErrors();renderSettings()}
renderAll();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
