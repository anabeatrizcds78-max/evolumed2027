<script>const APP_DATA={"examDate":"2026-10-11","target":80,"subjects":["Português","Matemática","Inglês","História","Geografia","Biologia","Química","Física"],"content":{"Português":[{"title":"Funcionamento social da língua","items":[{"id":"1.1","text":"Norma ortográﬁca."},{"id":"1.2","text":"Distinção entre variedades linguísticas: categorias sociais e contextos de comunicação; registros de formalidade e informalidade."},{"id":"1.3","text":"Relação entre escrita e oralidade."}],"weight":1.7},{"title":"Morfossintaxe","items":[{"id":"2.1","text":"Classes de palavras: substantivo, artigo, adjetivo, numeral, pronome, verbo, advérbio, prep- osição, conjunção e interjeição."},{"id":"2.2","text":"Elementos estruturais e processos de formação de palavras."},{"id":"2.3","text":"Flexão nominal e ﬂexão verbal (expressão de tempo, modo, aspecto e voz; correlação de tempos e modos)."},{"id":"2.4","text":"Concordância nominal e concordância verbal."},{"id":"2.5","text":"Regência nominal e regência verbal."}],"weight":2.4},{"title":"Processos sintático-semânticos","items":[{"id":"3.1","text":"Frase, oração e período."},{"id":"3.2","text":"Coordenação e subordinação."},{"id":"3.3","text":"Conectivos: função sintática e valores lógico-semânticos."},{"id":"3.4","text":"Organização e reorganização de orações e períodos."},{"id":"3.5","text":"Figuras de linguagem."}],"weight":2.4},{"title":"Compreensão, interpretação e produção de textos de gêneros variados e de diversas mídias (impressas, digitais etc.)","items":[{"id":"4.1","text":"Níveis de signiﬁcação do texto: signiﬁcação explícita e signiﬁcação implícita; denotação e conotação."},{"id":"4.2","text":"Estratégias de articulação do texto: mecanismos de coesão (coesão lexical, referencial e articulação de enunciados de qualquer extensão) e coerência."},{"id":"4.3","text":"Modos de organização do texto: descrição, narração e dissertação."},{"id":"4.4","text":"Citação de discursos: discurso direto, discurso indireto e discurso indireto livre."},{"id":"4.5","text":"Relação do texto com seu contexto histórico e cultural."},{"id":"4.6","text":"Intertextualidade e interdiscursividade."},{"id":"4.7","text":"Interação entre texto verbal e não verbal."}],"weight":3},{"title":"Literatura brasileira","items":[{"id":"5.1","text":"Períodos literários: Literatura de informação/Literatura dos jesuítas; Barroco; Arcadismo; Romantismo; Realismo/Naturalismo; Parnasianismo; Simbolismo; Pré-Modernismo; Modernismo; Pós-Modernismo."},{"id":"5.2","text":"Análise literária: gêneros literários; elementos de composição; recursos estilísticos."},{"id":"5.3","text":"Relação do texto literário com seu contexto histórico e cultural."}],"weight":1.7},{"title":"Literatura portuguesa","items":[{"id":"6.1","text":"Períodos literários: Trovadorismo; Humanismo; Classicismo; Barroco; Arcadismo; Romantismo; Realismo/Naturalismo; Parnasianismo; Simbolismo; Modernismo; Pós-Modernismo."},{"id":"6.2","text":"Análise literária: gêneros literários; elementos de composição; recursos estilísticos."},{"id":"6.3","text":"Relação do texto literário com seu contexto histórico e cultural."}],"weight":1.7},{"title":"Literaturas africanas em Língua Portuguesa","items":[{"id":"7.1","text":"Autores e obras representativos: Mia Couto (Moçambique); Paulina Chiziane (Moçambique); José Luandino Vieira (Angola); Pepetela (Angola); Ana Paula Tavares (Angola); Ondjaki (Angola)."},{"id":"7.2","text":"Análise literária: gêneros literários; elementos de composição; recursos estilísticos."},{"id":"7.3","text":"Relação do texto literário com seu contexto histórico e cultural."}],"weight":1.7},{"title":"Literatura indígena em Língua Portuguesa","items":[{"id":"8.1","text":"Autores representativos: Eliane Potiguara; Daniel Munduruku; Cristino Wapichana; Ailton Krenak; Davi Kopenawa."},{"id":"8.2","text":"Análise literária: gêneros literários; elementos de composição; recursos estilísticos."},{"id":"8.3","text":"Relação do texto literário com seu contexto histórico e cultural."}],"weight":1.7}],"Inglês":[{"title":"Compreensão e uso contextualizado da língua","items":[{"id":"1","text":"Compreensão do sentido geral e/ou do propósito do texto, bem como a identiﬁcação de seu gênero textual."},{"id":"2","text":"Compreensão de ideias expressas em trechos, frases e parágrafos, e/ou de sua relação com ideias presentes em outros trechos, frases e parágrafos do texto."},{"id":"3","text":"Localização de informação especíﬁca em um ou mais trechos do texto."},{"id":"4","text":"Identiﬁcação da referência textual de elementos de coesão tais como pronomes, advérbios, sinonímias, entre outros."},{"id":"5","text":"Compreensão da relação entre conteúdos de diferentes textos, ou das relações entre imagens, gráﬁcos, tabelas, infográﬁcos e texto."},{"id":"6","text":"Compreensão crítica de textos: discriminação entre fato e opinião; reconhecimento de posicionamentos, crenças ou opiniões expressas no texto; comparação entre diferentes perspectivas apresentadas sobre um mesmo assunto, entre outros."},{"id":"7","text":"Identiﬁcação do signiﬁcado de itens lexicais (palavras ou expressões) fundamentais para a adequada compreensão do texto, dentre eles verbos modais e marcadores discursivos como preposições, advérbios, conectivos e conjunções."}],"weight":3}],"Matemática":[{"title":"Conjuntos numéricos","items":[{"id":"1.1","text":"Números naturais, inteiros, racionais e reais: operações e propriedades, ordem, reta numérica e resolução de problemas."},{"id":"1.2","text":"Razões, proporcionalidade direta e inversa. Proporcionalidade entre duas grandezas, na qual uma é o quadrado da outra."},{"id":"1.3","text":"Notação cientíﬁca, algarismos signiﬁcativos e noção de erro em medições."},{"id":"1.4","text":"Sequências: noção de sequência; progressões aritméticas e geométricas; lei de formação e lei de recorrência."},{"id":"1.5","text":"Juros simples e compostos, porcentagem, taxas e índices."}],"weight":1.0},{"title":"Análise combinatória","items":[{"id":"2.1","text":"Princípios multiplicativo e aditivo em problemas de contagem."},{"id":"2.2","text":"Arranjos, permutações e combinações simples."}],"weight":2.5},{"title":"Probabilidade","items":[{"id":"3.1","text":"Espaço amostral: discreto e contínuo."},{"id":"3.2","text":"Eventos equiprováveis ou não, conjunto universo. Conceituação de probabilidade."},{"id":"3.3","text":"Eventos mutuamente exclusivos. Probabilidade da união e da intersecção de dois ou mais eventos."},{"id":"3.4","text":"Probabilidade condicional. Eventos independentes."}],"weight":2.5},{"title":"Sistemas lineares","items":[{"id":"4.1","text":"Resolução e discussão de um sistema linear."},{"id":"4.2","text":"Representação algébrica e gráﬁca de um sistema de equações lineares."}],"weight":1.8},{"title":"Funções","items":[{"id":"5.1","text":"Relação entre grandezas: velocidade, densidade demográﬁca, densidade volumétrica etc."},{"id":"5.2","text":"Gráﬁco de funções expressas por uma ou por diversas sentenças."},{"id":"5.3","text":"Taxa de variação: crescimento linear, quadrático, exponencial."},{"id":"5.4","text":"Função polinomial do 1º grau; função constante."},{"id":"5.5","text":"Equação da reta: forma reduzida; coeﬁcientes angular e linear. Intersecção de retas."},{"id":"5.6","text":"Função quadrática."},{"id":"5.7","text":"Pontos de máximo e mínimo em funções quadráticas."},{"id":"5.8","text":"Função exponencial e função logarítmica. Teoria dos logaritmos; uso de logaritmos em cálculos e modelagem de problemas."},{"id":"5.9","text":"Resolução de problemas envolvendo equações e/ou inequações: lineares, quadráticas, exponenciais, e logarítmicas e modulares."}],"weight":3},{"title":"Trigonometria","items":[{"id":"6.1","text":"Arcos e ângulos: medidas, relações entre arcos."},{"id":"6.2","text":"Funções seno e cosseno: representação algébrica e gráﬁca. Modelagem e análise de fenômenos periódicos."},{"id":"6.3","text":"Resolução de problemas envolvendo equações e inequações trigonométricas."},{"id":"6.4","text":"Resoluções de triângulos retângulos (seno, cosseno e tangente). Teorema dos senos. Teorema dos cossenos. Resolução de triângulos obtusângulos."}],"weight":1.8},{"title":"Geometria plana","items":[{"id":"7.1","text":"Figuras geométricas simples: reta, semirreta, segmento, ângulo plano, polígonos, circunferência e círculo."},{"id":"7.2","text":"Coordenadas e Plano cartesiano. Distância entre dois pontos. Ponto médio de um segmento de reta."},{"id":"7.3","text":"Transformações isométricas (translação, reﬂexão, rotação e composições) e homotéticas (ampliações e reduções)."},{"id":"7.4","text":"Congruência de ﬁguras planas."},{"id":"7.5","text":"Semelhança de triângulos."},{"id":"7.6","text":"Relações métricas nos triângulos, polígonos regulares e círculos."},{"id":"7.7","text":"Áreas de polígonos, círculos, coroa e setor circular."},{"id":"7.8","text":"Diferentes métodos para obtenção de áreas (reconﬁgurações, aproximações por cortes etc)."},{"id":"7.9","text":"Resolver problemas sobre ladrilhamento no plano. Pavimentação de superfícies utilizando o mesmo tipo de polígono ou não."}],"weight":2.6},{"title":"Geometria espacial","items":[{"id":"8.1","text":"Vistas ortogonais e representação plana de uma ﬁgura espacial."},{"id":"8.2","text":"Poliedros e corpos redondos."},{"id":"8.3","text":"Prisma, pirâmides e respectivos troncos. Cálculo de áreas, volumes e capacidade."},{"id":"8.4","text":"Cilindro, cone e esfera: cálculo de áreas, volumes e capacidade."},{"id":"8.5","text":"Deformações de áreas e ângulos provocadas pelas diferentes projeções usadas na cartograﬁa."}],"weight":2.6},{"title":"Tratamento da informação","items":[{"id":"9.1","text":"Gráﬁcos: setores, linhas, barras, infográﬁcos, histogramas, caixa (box-plot), ramos e folhas. Tabelas e planilhas."},{"id":"9.2","text":"Medidas de tendência central (moda, mediana e média) e de dispersão (amplitude, desvio padrão e variância)."},{"id":"9.3","text":"Representação, interpretação e resolução de problemas envolvendo algoritmos. Fluxograma. Conceitos básicos de linguagem de programação."}],"weight":1.0},{"title":"Sistemas de Contagem e de Medidas","items":[{"id":"10.1","text":"Sistema Internacional de Medidas: principais unidades e conversões. Unidade de medida de armazenamento e de transferência de dados na informática."},{"id":"10.2","text":"Base decimal, base binária, base sexagesimal e outras bases de sistemas de contagem."}],"weight":1.0}],"Biologia":[{"title":"Ecologia e Meio Ambiente","items":[{"id":"1.1","text":"Principais conceitos de Ecologia (população, comunidade, ecossistema, biosfera, hábitat e nicho ecológico); cadeias, teias alimentares e níveis tróﬁcos; ﬂuxo energético nas teias alimentares; conceito de produtividade."},{"id":"1.2","text":"Pirâmides ecológicas."},{"id":"1.3","text":"Ciclos biogeoquímicos: água, oxigênio, carbono e nitrogênio."},{"id":"1.4","text":"Densidade populacional; taxas populacionais; crescimento populacional."},{"id":"1.5","text":"Fatores que regulam o tamanho das populações."},{"id":"1.6","text":"Sucessão ecológica."},{"id":"1.7","text":"Ecossistemas terrestres (principais biomas do Brasil) e ecossistemas aquáticos; principais ameaças antrópicas a esses ambientes."},{"id":"1.8","text":"Relações ecológicas intraespecíﬁcas e interespecíﬁcas."},{"id":"1.9","text":"Poluição ambiental: do ar, da água, do solo, sonora, visual e radioativa."},{"id":"1.10","text":"Impactos da intervenção humana sobre a biodiversidade: destruição, modiﬁcação e fragmentação de hábitats; superexploração de espécies e dos recursos naturais; introdução de espécies exóticas; extinção de espécies; substâncias não biodegradáveis e bioacumulação tróﬁca; uso intensivo de fertilizantes; uso excessivo de inseticidas; uso excessivo de combustíveis fósseis; acidentes radioativos; descarte indevido de resíduos e seus efeitos nas cadeias tróﬁcas; problemas com o lixo eletrônico (e-lixo)."},{"id":"1.11","text":"Alternativas energéticas e soluções contra as ameaças ao equilíbrio dos ecossistemas."},{"id":"1.12","text":"Pegada ecológica e conservação biológica (unidades de conservação)."}],"weight":3},{"title":"Bioquímica","items":[{"id":"2.1","text":"Principais componentes químicos dos seres vivos (água, sais minerais, carboidratos, proteínas, lipídios, ácidos nucleicos e vitaminas)."}],"weight":1.0},{"title":"Citologia","items":[{"id":"2.2","text":"Organização celular dos seres vivos (célula procariota e células eucariotas vegetal e animal)."},{"id":"2.3","text":"Envoltórios celulares; membrana plasmática e suas diferenciações; troca de substâncias entre a célula e o meio (difusão, difusão facilitada, osmose, transporte ativo, fagocitose, pinocitose)."},{"id":"2.4","text":"Principais componentes citoplasmáticos; funções das estruturas e das organelas celulares."},{"id":"2.5","text":"Núcleo interfásico e seus componentes; citogenética humana; ciclo celular; divisões celulares (mitose e meiose) e gráﬁcos representativos."}],"weight":2.3},{"title":"Reprodução e Embriologia","items":[{"id":"2.6","text":"Noções básicas de reprodução assexuada e sexuada dos animais."},{"id":"2.7","text":"Gametogênese nos mamíferos."},{"id":"2.8","text":"Noções básicas de embriologia (etapas do desenvolvimento embrionário; importância dos anexos embrionários; diferenças na formação entre gêmeos univitelinos e bivitelinos)."}],"weight":1.0},{"title":"Metabolismo energético","items":[{"id":"2.9","text":"Metabolismo energético: energia para a vida (fotossíntese, quimiossíntese, respiração aeróbia e fermentação)."}],"weight":2.3},{"title":"Biologia Molecular","items":[{"id":"2.10","text":"Estrutura molecular do DNA e do RNA; tipos de RNA e suas funções; replicação do DNA e transcrição gênica."},{"id":"2.11","text":"Código genético e síntese proteica (tradução)."},{"id":"2.12","text":"Ativação gênica e diferenciação celular."},{"id":"2.13","text":"Mutações gênicas, numéricas e estruturais."}],"weight":2.3},{"title":"Biotecnologia","items":[{"id":"2.14","text":"Mundo tecnológico, biotecnologia e biologia forense: melhoramento genético; produção de DNA recombinante; clonagem de plantas e animais; organismos transgênicos; terapia gênica; teste de DNA na identiﬁcação de pessoas; descoberta de genomas; uso de células-tronco; CRISPR- edição do DNA; técnica de reação em cadeia da polimerase (PCR); análise forense."}],"weight":2.3},{"title":"Taxonomia e Sistemática","items":[{"id":"3.1","text":"Níveis de organização da vida; classiﬁcação e nomenclatura binomial de Lineu; categorias taxonômicas; sistemática moderna; cladogramas."}],"weight":1.0},{"title":"Microbiologia e diversidade","items":[{"id":"3.2","text":"Vírus: características gerais, reprodução e importância."},{"id":"3.3","text":"Características gerais dos seres vivos pertencentes aos Domínios: Archaea, Bacteria e Eukarya."},{"id":"3.4","text":"Características gerais dos seres vivos pertencentes aos Reinos: Monera, Protista, Fungi, Plantae e Animalia."},{"id":"3.5","text":"Importância ecológica de bactérias, fungos, protozoários e algas."}],"weight":1.0},{"title":"Botânica","items":[{"id":"4.1","text":"Biologia das plantas; características e adaptações gerais e ciclos de vida dos principais grupos: brióﬁtas (musgo), pteridóﬁtas (samambaia), gimnospermas (Pinus) e angiospermas; reprodução assexuada nas plantas."},{"id":"4.2","text":"Anatomia vegetal: principais tecidos e suas funções; funções básicas dos órgãos: raiz, caule, folha, frutos e sementes."},{"id":"4.3","text":"Fisiologia das angiospermas: transpiração; absorção, nutrição, fotossíntese (fatores que inﬂuenciam a fotossíntese e PCF); condução de seivas; ﬁtormônios; fototropismo e geotropismo; ﬁtocromo e desenvolvimento."}],"weight":1.7},{"title":"Zoologia e Fisiologia Animal","items":[{"id":"4.4","text":"Biologia dos animais; principais ﬁlos animais e suas características anatômicas básicas e gerais; tipos de simetrias; características embrionárias (número de folhetos embrionários; protostômios ou deuterostômios, presença ou não do celoma); hábitats; principais adaptações."},{"id":"4.5","text":"Craniados e vertebrados: características gerais e adaptações morfológicas."},{"id":"4.6","text":"Fisiologia dos animais: revestimento, sustentação, digestão, respiração, circulação, excreção e reprodução."}],"weight":3},{"title":"Fisiologia Humana","items":[{"id":"5.1","text":"Fisiologia humana básica: sistema digestório, sistema cardiovascular, sangue, sistema respiratório, sistema urinário, sistema nervoso, sistema sensorial, sistema endócrino, sistema locomotor (esquelético e muscular), sistema genital, reprodução humana (ciclo menstrual, gravidez e parto), sistema imunológico e sistema linfático."}],"weight":3},{"title":"Saúde e Parasitologia","items":[{"id":"5.2","text":"Alimentos e nutrição; segurança alimentar; ação das substâncias psicoativas (drogas) no sistema nervoso."},{"id":"5.3","text":"Concepção de saúde; higiene; SUS; saneamento básico; conceitos de endemia, pandemia e epidemia; tipos de imunidade natural e artiﬁcial; vacina e soro terapêutico."},{"id":"5.4","text":"Planejamento familiar (métodos anticoncepcionais); infecções sexualmente transmissíveis (IST)."},{"id":"5.5","text":"Principais doenças humanas causadas por vírus e por bactérias (agentes etiológicos, formas de transmissão e proﬁlaxias)."},{"id":"5.6","text":"Doenças humanas causadas por fungos (formas de transmissão e proﬁlaxias) e por protozoários (agentes etiológicos, formas de transmissão e proﬁlaxias): amebíase, malária, doença de Chagas e leishmaniose."},{"id":"5.7","text":"Doenças humanas causadas por helmintos: teníase, cisticercose, esquistossomose, ascaridíase, ancilostomose. Os ciclos básicos de vida dos helmintos, formas de transmissão e suas proﬁlaxias."}],"weight":1.0},{"title":"Genética","items":[{"id":"6.1","text":"Experimentos, 1ª e 2ª Leis de Gregor Mendel; relações da meiose com os princípios mendelianos."},{"id":"6.2","text":"Conceitos básicos de Genética; inﬂuência do ambiente sobre o genótipo e o fenótipo; noções de probabilidade aplicada à Genética; genealogias (ou heredogramas)."},{"id":"6.3","text":"Ausência de dominância, alelos letais e alelos múltiplos (polialelia)."},{"id":"6.4","text":"Herança de grupos sanguíneos na espécie humana (sistemas: ABO e Rh)."},{"id":"6.5","text":"Epistasias e herança quantitativa."},{"id":"6.6","text":"Genes localizados no mesmo cromossomo (genes ligados) e mapeamento cromossômico."},{"id":"6.7","text":"Genes localizados em cromossomos sexuais; sistema XY e sistema ZW; heranças relacionadas ao sexo; reconhecimento dos tipos de heranças genéticas (autossômicas, sexuais e mitocondrial)."}],"weight":3},{"title":"Evolução","items":[{"id":"7.1","text":"Teorias da origem da vida na Terra; hipóteses sobre a evolução do metabolismo energético e evolução da célula."},{"id":"7.2","text":"Ideias evolucionistas de J. B. Lamarck, C. Darwin, A. R. Wallace; ideias ﬁxistas; Teoria moderna da evolução."},{"id":"7.3","text":"Evidências da evolução biológica."},{"id":"7.4","text":"Construção e análise de árvores ﬁlogenéticas."},{"id":"7.5","text":"Genética de populações."},{"id":"7.6","text":"Formação de novas espécies; tipos de isolamento reprodutivo; origem dos grandes grupos de seres vivos."},{"id":"7.7","text":"Evolução humana; características dos hominídeos; parentescos evolutivos; evolução do gênero Homo; dispersão pelo mundo; diversidade fenotípica do Homo sapiens."}],"weight":1.7}],"Física":[{"title":"Fundamentos da Física","items":[{"id":"1.1","text":"Grandezas fundamentais e derivadas."},{"id":"1.2","text":"Sistemas de unidade. Sistema Internacional (SI)."},{"id":"1.3","text":"Análise dimensional."},{"id":"1.4","text":"Grandezas direta e inversamente proporcionais."},{"id":"1.5","text":"A representação gráﬁca de uma relação funcional entre duas grandezas. Interpretação do signiﬁcado da inclinação da reta tangente à curva e da área sob a curva."},{"id":"1.6","text":"Grandezas vetoriais e escalares. Adição, subtração e decomposição de vetores. Multiplicação de um vetor por um número real."}],"weight":1.5},{"title":"Mecânica","items":[{"id":"2.1","text":"Cinemática. 2.1.1. Velocidade escalar média e instantânea. 2.1.2. Aceleração escalar média e instantânea. 2.1.3. Representação gráﬁca, em função do tempo, do espaço, da velocidade escalar e da aceleração escalar de um corpo. 2.1.4. Velocidade vetorial instantânea e média de um corpo. 2.1.5. Aceleração vetorial de um corpo e suas componentes tangencial e centrípeta. 2.1.6. Movimentos uniformes e uniformemente variados. Suas equações horárias. Queda livre e lançamento vertical. 2.1.7. Movimento circular uniforme, sua velocidade angular, período, frequência, sua aceleração centrípeta e correspondente relação com a velocidade escalar e o raio da trajetória. Acoplamento de polias e engrenagens."},{"id":"2.2","text":"Balística. 2.2.1. Lançamentos horizontal e oblíquo (sem resistência do ar). 2.2.2. Equações do movimento de um projétil a partir de seus movimentos horizontal e vertical."},{"id":"2.3","text":"Movimento e as leis de Newton. 2.3.1. Forças e composição vetorial das forças que atuam sobre um corpo. 2.3.2. Conceito de resultante de forças e sua obtenção por adição vetorial. 2.3.3. Princípio da Inércia (Primeira Lei de Newton). Referencial inercial. 2.3.4. Massa e peso: diferenças entre essas grandezas, instrumentos de medição de cada uma. 2.3.5. Princípio fundamental da Dinâmica (Segunda Lei de Newton). Sua aplicação em movimentos retilíneos ou em situações de equilíbrio. Máquina de Atwood: polias ﬁxas e móveis. 2.3.6. Princípio da Ação e Reação (Terceira Lei de Newton). 2.3.7. Centro de massa de um sistema. O teorema da aceleração do centro de massa. 2.3.8. Momento ou torque de uma força. Condições de equilíbrio de um ponto material e de um corpo extenso. 2.3.9. Força de atrito. Diferenças entre o atrito cinético e o estático. Suas equações e representação gráﬁca da força de atrito. 2.3.10. Força centrípeta. A Segunda Lei de Newton para movimentos curvilíneos com ou sem atrito."},{"id":"2.4","text":"Gravitação newtoniana. 2.4.1. Sistemas geocêntrico e heliocêntrico. Evolução histórica do modelo de Universo. O sistema solar. O dia e a noite. Eclipses. As fases da Lua. 2.4.2. Leis de Kepler. 2.4.3. Lei da gravitação universal de Newton. 2.4.4. O campo gravitacional. 2.4.5. Órbitas. Órbita circular. 2.4.6. Satélites artiﬁciais. Satélites geoestacionários. 2.4.7. Energia potencial gravitacional (em campos gravitacionais variáveis)."},{"id":"2.5","text":"Dinâmica impulsiva. 2.5.1. Quantidade de movimento de um corpo e de um sistema de corpos. 2.5.2. Impulso exercido por uma força constante e por uma força variável. 2.5.3. Teorema do impulso. Relação entre impulso e quantidade de movimento. 2.5.4. Forças internas e externas a um sistema de corpos. 2.5.5. Sistemas isolados de forças externas e lei da conservação da quantidade de movimento. 2.5.6. Conservação da quantidade de movimento em explosões, colisões e disparos de projéteis."},{"id":"2.6","text":"Trabalho e energia. 2.6.1. Trabalho realizado por uma força constante. 2.6.2. Trabalho realizado por uma força variável em módulo. Interpretação do gráﬁco força versus deslocamento. 2.6.3. Energia cinética e o teorema da energia cinética. 2.6.4. Forças conservativas (peso, força elástica e força elétrica) e não conservativas. 2.6.5. Trabalho realizado por forças conservativas. 2.6.6. Energia potencial gravitacional e elástica. 2.6.7. Energia mecânica. 2.6.8. Sistemas conservativos e o teorema da conservação da energia mecânica. 2.6.9. Sistemas não conservativos. Trabalho realizado por forças não conservativas. Trabalho realizado pela força de atrito. 2.6.10. Potência."},{"id":"2.7","text":"Fluidos. 2.7.1. Massa especíﬁca de uma substância e densidade de um corpo. 2.7.2. Pressão exercida por uma força. 2.7.3. Pressão exercida por um líquido em equilíbrio. Pressão hidrostática. 2.7.4. Teorema de Stevin e aplicações. A experiência de Torricelli. 2.7.5. O princípio de Pascal. Prensa hidráulica. 2.7.6. O teorema de Arquimedes. 2.7.7. Hidrodinâmica. Vazão. A equação da continuidade. Equação de Bernoulli."}],"weight":3},{"title":"Física térmica","items":[{"id":"3.1","text":"Termometria. 3.1.1. Energia térmica, temperatura e termômetros. Lei zero da termodinâmica. 3.1.2. Escalas termométricas. As escalas Celsius, Fahrenheit e Kelvin. Relação matemática entre elas."},{"id":"3.2","text":"Dilatação térmica. 3.2.1. Dilatação térmica dos sólidos: linear, superﬁcial e volumétrica. 3.2.2. Dilatação térmica de líquidos e gases."},{"id":"3.3","text":"Calorimetria. 3.3.1. Calor como forma de energia em trânsito e suas unidades de medida. 3.3.2. Calor sensível, calor especíﬁco sensível e capacidade térmica. 3.3.3. Mudanças de estado de agregação. O calor latente e o calor especíﬁco latente. Curvas de aquecimento. 3.3.4. O diagrama de fases de uma substância. 3.3.5. Troca de calor em sistemas termicamente isolados. O equilíbrio térmico. 3.3.6. Potência térmica."},{"id":"3.4","text":"Propagação de calor. 3.4.1. Condução, convecção e irradiação de calor. O vaso de Dewar e a garrafa térmica."},{"id":"3.5","text":"Gás ideal. 3.5.1. O modelo de gás ideal. 3.5.2. A equação de estado (Equação de Clapeyron) para um gás ideal. 3.5.3. Lei geral dos gases perfeitos. 3.5.4. Transformações gasosas isotérmicas, isobáricas e isocóricas (ou isovolumétricas)."},{"id":"3.6","text":"Termodinâmica. 3.6.1. Trabalho realizado pelas forças exercidas por um gás. 3.6.2. Energia interna. 3.6.3. A experiência de Joule e o equivalente mecânico do calor. 3.6.4. Primeira Lei da Termodinâmica. 3.6.5. Transformações adiabática e cíclica. 3.6.6. Segunda Lei da Termodinâmica. 3.6.7. Máquinas térmicas e máquinas frigoríﬁcas. O ciclo de Carnot."}],"weight":2.3},{"title":"Óptica","items":[{"id":"4.1","text":"Princípios da óptica geométrica. 4.1.1. Princípio da propagação retilínea dos raios luminosos. Sombra e penumbra. Câmara escura de orifício. 4.1.2. Princípio da reversibilidade dos raios de luz. 4.1.3. Princípio da independência dos raios de luz."},{"id":"4.2","text":"Reﬂexão da luz e formação de imagem. 4.2.1. Leis da reﬂexão. 4.2.2. Imagem de um ponto e de um corpo extenso. 4.2.3. Espelhos planos. Construção e classiﬁcação da imagem. Campo visual. Translação e rotação de um espelho plano. Associação de espelhos planos. 4.2.4. Espelhos esféricos. Condições de nitidez, elementos e raios notáveis de um espelho esférico. 4.2.5. Construção geométrica e classiﬁcação de imagens em um espelho esférico. 4.2.6. Estudo analítico de um espelho esférico. Equação dos pontos conjugados e do aumento linear transversal. 4.2.7. Aplicações práticas de um espelho esférico."},{"id":"4.3","text":"Refração luminosa. 4.3.1. Fenômeno da refração. Índice de refração absoluto e relativo. 4.3.2. Leis da refração. Lei de Snell-Descartes. 4.3.3. Ângulo limite e reﬂexão total da luz. 4.3.4. Dioptro plano. 4.3.5. Lâmina de faces paralelas. 4.3.6. Prismas. 4.3.7. A dispersão luminosa e a refração na atmosfera."},{"id":"4.4","text":"Lentes esféricas delgadas. 4.4.1. Focos e comportamento óptico de uma lente esférica. 4.4.2. Raios notáveis de uma lente esférica. 4.4.3. Construção geométrica e classiﬁcação de imagens em uma lente esférica. 4.4.4. Estudo analítico das lentes esféricas. Equação dos pontos conjugados e do aumento linear transversal. 4.4.5. Vergência de uma lente. 4.4.6. Aplicações práticas das lentes esféricas. 4.4.7. Instrumentos ópticos: câmera fotográﬁca, microscópio simples e composto, lunetas terrestre e astronômica, telescópios e projetores."},{"id":"4.5","text":"Olho humano. 4.5.1. O olho emetrope. 4.5.2. Ametropias: miopia, hipermetropia, presbiopia e astigmatismo. 4.5.3. Correção de miopia, hipermetropia e presbiopia utilizando lentes esféricas. A dioptria."}],"weight":2.3},{"title":"Oscilações e ondas","items":[{"id":"5.1","text":"Período de um pêndulo simples e de um sistema massa-mola. Associação de molas ideais."},{"id":"5.2","text":"Movimento harmônico simples (MHS), sua velocidade e aceleração, relação entre posição e aceleração. Suas equações horárias."},{"id":"5.3","text":"Pulsos e ondas. Classiﬁcação das ondas."},{"id":"5.4","text":"Comprimento de onda, período e frequência de uma onda."},{"id":"5.5","text":"O espectro eletromagnético. Aplicações das ondas eletromagnéticas."},{"id":"5.6","text":"Velocidade de propagação. A equação fundamental da ondulatória."},{"id":"5.7","text":"Fenômenos ondulatórios: reﬂexão, refração, interferência, polarização, difração e ressonância."},{"id":"5.8","text":"Propagação de um pulso em meios unidimensionais. Lei de Taylor."},{"id":"5.9","text":"Ondas planas e esféricas."},{"id":"5.10","text":"Ondas estacionárias."},{"id":"5.11","text":"Caráter ondulatório da luz: cor e frequência."},{"id":"5.12","text":"Caráter ondulatório do som. Ondas sonoras. Velocidade de propagação do som."},{"id":"5.13","text":"Qualidades ﬁsiológicas do som: altura, timbre e intensidade."},{"id":"5.14","text":"Reforço, reverberação e eco."},{"id":"5.15","text":"Nível sonoro. O decibel."},{"id":"5.16","text":"Cordas vibrantes e tubos sonoros."},{"id":"5.17","text":"Efeito Doppler."}],"weight":2.3},{"title":"Eletricidade","items":[{"id":"6.1","text":"Eletrostática. 6.1.1. Carga elétrica, sua conservação e quantização. Carga elétrica elementar. 6.1.2. Propriedade elétrica dos materiais isolantes, condutores, semicondutores e supercondutores: diferenças e noções básicas. Processos de eletrização: atrito, contato e indução. 6.1.3. Lei de Coulomb. 6.1.4. Campo elétrico gerado por cargas puntiformes. Campo elétrico uniforme. Linhas de campo elétrico. 6.1.5. Potencial e diferença de potencial elétrico. Linhas e superfícies equipotenciais. 6.1.6. Energia potencial elétrica. 6.1.7. Trabalho realizado pela força elétrica. 6.1.8. Condutores em equilíbrio eletrostático. 6.1.9. Poder das pontas e blindagem eletrostática."},{"id":"6.2","text":"Eletrodinâmica. 6.2.1. Corrente elétrica e intensidade de corrente elétrica. 6.2.2. Tensão elétrica. 6.2.3. Resistência elétrica. 6.2.4. Potência elétrica. Efeito joule. Consumo de energia elétrica. O quilowatt-hora. 6.2.5. Resistores. Primeira Lei de Ohm. Segunda Lei de Ohm. Resistividade elétrica. 6.2.6. Associação de resistores. 6.2.7. Noções de instalação elétrica residencial. 6.2.8. Geradores elétricos. Força eletromotriz e resistência interna. Equação e curva característica de um gerador. 6.2.9. Receptores elétricos. Força contraeletromotriz e resistência interna. Equação e curva característica de um receptor. 6.2.10. Circuitos elétricos. 6.2.11. Leis de Kirchhoff. 6.2.12. Medidores elétricos. 6.2.13. Capacitores. Associação de capacitores. Energia potencial elétrica armazenada em um capacitor. Carga e descarga de capacitores."},{"id":"6.3","text":"Eletromagnetismo. 6.3.1. Polos magnéticos, ímãs, campo magnético e linhas de indução magnética. O campo magnético terrestre. 6.3.2. Campo magnético criado por corrente elétrica: condutor retilíneo longo, espira circular e solenoide. 6.3.3. Força magnética sobre uma carga puntiforme em movimento em um campo magnético uniforme. Trajetórias da carga nesse campo. 6.3.4. Força magnética sobre condutores retilíneos percorridos por corrente, imersos em um campo magnético uniforme. 6.3.5. Força magnética entre condutores retilíneos paralelos. 6.3.6. Indução eletromagnética. Fluxo magnético. Diferença de potencial induzida e corrente elétrica induzida. Lei de Lenz. 6.3.7. Lei de Faraday-Neumann. 6.3.8. Princípio de funcionamento de motores elétricos e de medidores de corrente, de diferença de potencial (tensão) e de resistência. 6.3.9. Noções de correntes alternadas. Transformadores. 6.3.10. Produção e consumo de energia elétrica. Matriz energética. Rendimento e relação custo-benefício."}],"weight":2.3},{"title":"Noções de física moderna","items":[{"id":"7.1","text":"Energia quantizada de um fóton. Lasers e seus efeitos nos seres vivos."},{"id":"7.2","text":"O modelo de Bohr para o átomo de hidrogênio."},{"id":"7.3","text":"A dualidade onda-partícula. A natureza dual da luz."},{"id":"7.4","text":"O efeito fotoelétrico."},{"id":"7.5","text":"O princípio da incerteza de Heisenberg."},{"id":"7.6","text":"Relatividade especial: a relação entre massa e energia."},{"id":"7.7","text":"Noções de radioatividade. Decaimento nuclear. Fissão e fusão nuclear. Acidentes nucleares."},{"id":"7.8","text":"A Física das Partículas Elementares. O modelo padrão. Força forte e eletrofraca. Aceleradores de partículas."},{"id":"7.9","text":"Noções de Relatividade geral. A teoria do big bang. Modelos cosmológicos. Expansão do Universo e evolução estelar."}],"weight":1.5}],"Química":[{"title":"Materiais: uso e propriedades","items":[{"id":"1.1","text":"Origem e ocorrência de materiais."},{"id":"1.2","text":"Propriedades gerais e especíﬁcas dos materiais."},{"id":"1.3","text":"Relação entre uso e propriedades dos materiais."},{"id":"1.4","text":"Misturas: tipos e métodos de separação."},{"id":"1.5","text":"Estados físicos da matéria e mudanças de estado. Diagramas de aquecimento/resfriamento de substâncias químicas e misturas."}],"weight":1.6},{"title":"O átomo isolado e sua estrutura","items":[{"id":"2.1","text":"A teoria atômica de Dalton: a indivisibilidade do átomo e a escala de massas atômicas."},{"id":"2.2","text":"A natureza elétrica e divisível do átomo: descoberta das partículas elementares elétron e próton. A evolução dos modelos atômicos. O modelo atômico de Thomson. O modelo do átomo nuclear de Rutherford."},{"id":"2.3","text":"Modelo atômico de Rutherford-Bohr, a descontinuidade dos níveis energéticos eletrônicos e a explicação de alguns fenômenos de átomos isolados."},{"id":"2.4","text":"Número atômico e número de massa. Semelhanças entre átomos: isótopos, isóbaros e isótonos."},{"id":"2.5","text":"Elementos químicos e Classiﬁcação Periódica: história, organização, representação e propriedades periódicas."}],"weight":1.6},{"title":"Gases","items":[{"id":"3.1","text":"Teoria cinética dos gases: modelo do gás ideal."},{"id":"3.2","text":"Propriedades físicas, Leis dos gases e Equação de Estado dos Gases ideais."},{"id":"3.3","text":"Atmosfera terrestre: composição e características."}],"weight":2.3},{"title":"Transformações químicas: evidências, representações e aspectos quantitativos","items":[{"id":"4.1","text":"Evidências macroscópicas da ocorrência de transformações químicas: alteração de cor, desprendimento de gás, formação/desaparecimento de sólidos, absorção/liberação de energia."},{"id":"4.2","text":"Representação de substâncias e de transformações químicas. 4.2.1. Fórmulas químicas: fórmula mínima, fórmula centesimal, fórmula molecular. 4.2.2. Equações químicas e balanceamento."},{"id":"4.3","text":"Aspectos quantitativos das transformações químicas. 4.3.1. Lei de Lavoisier e Lei de Proust. 4.3.2. Cálculos estequiométricos: massa, volume, quantidade de matéria (mol), massa molar."}],"weight":1.6},{"title":"O átomo ligado: tipos de ligações e substâncias químicas","items":[{"id":"5.1","text":"Estabilização de átomos iguais ou diferentes pela formação de ligação química."},{"id":"5.2","text":"Características gerais de tipos de ligações químicas: ligação covalente, ligação iônica e ligação metálica. Interações intermoleculares entre espécies químicas estáveis."},{"id":"5.3","text":"Tipos de substâncias em termos do tipo de ligação química predominante existente entre suas unidades constituintes. 5.3.1. Substâncias moleculares. 5.3.1.1. Características gerais das substâncias moleculares. 5.3.1.2. Ligações covalentes em moléculas isoladas. Pares eletrônicos de Lewis. Regra do octeto: vantagens e limitações. 5.3.1.3. Polaridade das ligações covalentes. O uso da eletronegatividade na análise da polaridade de uma ligação química. Polaridade de uma molécula e geometria molecular. 5.3.1.4. Estudo de algumas substâncias moleculares isoladas (ocorrência, obtenção, propriedades, aplicação): H2, O2, N2, Cℓ2, NH3, H2O, H2O2, CO2, HCℓ, CH4. 5.3.1.5. Implicações ambientais da produção e da utilização dessas substâncias. 5.3.1.6. Interações intermoleculares: Forças de Van der Waals (dipolo instantâneo-dipolo induzido ou Forças de Dispersão de London, dipolo induzido por dipolo e dipolo permanente-dipolo permanente ou dipolo-dipolo), ligação de hidrogênio. Interações íon-dipolo. 5.3.1.7. Variedades alotrópicas: os casos do carbono, oxigênio, enxofre e fósforo. 5.3.2. Substâncias iônicas. 5.3.2.1. Compostos iônicos: características gerais. 5.3.2.2. Ligação iônica. Formação de compostos iônicos como resultado da atração eletrostática entre íons de cargas opostas. Fórmulas unitárias para compostos iônicos simples. 5.3.2.3. Estudo das principais substâncias iônicas dos grupos (ocorrência, obtenção, propriedades e aplicação): cloreto, carbonato, nitrato, fosfato e sulfato. 5.3.2.4. Implicações ambientais da produção e da utilização dessas substâncias. 5.3.3. Substâncias metálicas. 5.3.3.1. Metais: características gerais. 5.3.3.2. Ligação metálica. Estabilização de metais pelo “mar de elétrons” compartilhado pela estrutura. 5.3.3.3. Ligas metálicas. 5.3.3.4. Estudo de alguns metais (ocorrência, obtenção, propriedades e aplicação): alumínio, chumbo, cobre, cromo, estanho, ferro, magnésio, manganês, níquel, ouro, prata e zinco. 5.3.3.5. Implicações ambientais da produção e da utilização dessas substâncias."}],"weight":1.6},{"title":"Água e soluções aquosas","items":[{"id":"6.1","text":"Ligação, estrutura, propriedades físicas e químicas da água; ocorrência e importância na vida animal e vegetal. Ligação de hidrogênio e sua inﬂuência nas propriedades da água."},{"id":"6.2","text":"Interações da água com outras substâncias. 6.2.1. Soluções aquosas: conceito e classiﬁcação. 6.2.2. Solubilidade e concentrações (porcentagem, ppm, ppb, fração em mol, g/L, mol/L, mol/kg, conversões de unidades). Operações envolvendo soluções (diluições e misturas de soluções com ou sem reação química). 6.2.3. Propriedades coligativas: conceito, aspectos qualitativos e quantitativos."},{"id":"6.3","text":"Tratamento da água."}],"weight":3},{"title":"Ácidos, bases, sais e óxidos","items":[{"id":"7.1","text":"Principais propriedades dos ácidos e bases: interação com indicadores, condutibilidade elétrica, reação com metais, reação de neutralização."},{"id":"7.2","text":"Modelos de ácidos e bases, de acordo com as teorias de Arrhenius, de Lewis e de Brønsted-Lowry."},{"id":"7.3","text":"Estudo de alguns ácidos e bases (obtenção, propriedades e aplicação): ácido acético, ácido clorídrico, ácido sulfúrico, ácido nítrico, ácido fosfórico, hidróxido de sódio, hidróxido de cálcio, solução aquosa de amônia."},{"id":"7.4","text":"Sais: conceito, propriedades e classiﬁcação."},{"id":"7.5","text":"Óxidos: conceito, propriedades e classiﬁcação."}],"weight":1.6},{"title":"Transformações químicas: um processo dinâmico","items":[{"id":"8.1","text":"Cinética química. 8.1.1. Rapidez de reações e teoria das colisões efetivas. 8.1.2. Energia de ativação. 8.1.3. Fatores que alteram a rapidez das reações: superfície de contato, concentração, pressão, temperatura e catalisador. Conceito de ordem de reação."},{"id":"8.2","text":"Equilíbrio químico. 8.2.1. Caracterização dos sistemas em equilíbrio químico. 8.2.2. Equilíbrio em sistemas homogêneos e heterogêneos. 8.2.3. Constantes de equilíbrio e cálculos simples de equilíbrio. 8.2.4. Fatores que alteram o sistema em equilíbrio: princípio de Le Châtelier. 8.2.5. Produto iônico da água, equilíbrio ácido-base e pH, indicadores. 8.2.6. Hidrólise de sais."},{"id":"8.3","text":"Aplicação da cinética química e do equilíbrio químico no cotidiano."}],"weight":1.6},{"title":"Transformações de substâncias químicas e energia","items":[{"id":"9.1","text":"Transformações químicas e energia térmica. 9.1.1. Calor de reação: reação exotérmica e endotérmica. 9.1.2. Medida do calor de transformações por aquecimento de água. 9.1.3. Conceito de entalpia. 9.1.4. Equações termoquímicas. 9.1.5. Lei de Hess."},{"id":"9.2","text":"Energia nas mudanças de estado e em processos de dissolução e recristalização de sólidos em solventes."},{"id":"9.3","text":"Entalpia de ligação."},{"id":"9.4","text":"Transformações químicas e energia elétrica. 9.4.1. Reações de oxirredução e números de oxidação. Agentes oxidantes e redutores. 9.4.2. Potenciais-padrão de redução. 9.4.3. Transformação química e produção de energia elétrica: pilha. 9.4.4. Transformação química e consumo de energia elétrica: eletrólise. 9.4.5. Leis de Faraday."},{"id":"9.5","text":"Transformações nucleares. 9.5.1. Conceitos fundamentais da radioatividade: tipos de emissões e suas características. 9.5.2. Reações nucleares: ﬁssão e fusão nucleares. 9.5.3. Desintegração radioativa: meia-vida, datação e uso de radioisótopos. 9.5.4. Origem das energias envolvidas em processos nucleares: perda de massa e equação de Einstein. 9.5.5. Usos da energia nuclear e implicações ambientais."}],"weight":1.6},{"title":"Estudo dos compostos de carbono","items":[{"id":"10.1","text":"As características gerais dos compostos orgânicos. 10.1.1. Elementos químicos constituintes, fórmulas moleculares, estruturais e de Lewis, cadeias carbônicas, ligações e isomeria. 10.1.2. Principais radicais funcionais e funções orgânicas. 10.1.3. Reconhecimento de hidrocarbonetos, compostos halogenados, álcoois, fenóis, éteres, ésteres, aldeídos, cetonas, ácidos carboxílicos, aminas e amidas. 10.1.4. Propriedades físicas dos compostos orgânicos. 10.1.5. Principais tipos de reações orgânicas: substituição, adição, eliminação, oxidação/redução, esteriﬁcação e hidrólise ácida e básica. Saponiﬁcação."},{"id":"10.2","text":"Hidrocarbonetos. 10.2.1. Classiﬁcação. 10.2.2. Estudo do metano, etileno, acetileno, tolueno e benzeno. 10.2.3. Carvão, petróleo e gás natural: origem, ocorrência e composição; destilação fracionada; combustão; implicações ambientais do uso de combustíveis fósseis."},{"id":"10.3","text":"Compo ":4,"7":4,"4":4,"5":4,"9":5,"10":5,"8":5,"12":6,"13":6,"11":6,"16":7,"17":7,"14":7,"15":7,"19":8,"18":8,"21":9,"20":9,"24":10,"22":10,"23":10,"28":11,"29":11,"25":11,"26":11,"27":11,"32":12,"33":12,"30":12,"31":12,"36":13,"37":13,"34":13,"35":13,"39":14,"38":14,"41":15,"42":15,"40":15,"45":16,"43":16,"44":16,"48":17,"46":17,"47":17,"50":18,"49":18},"explanations":{"1":"O personagem Terêncio desafiou Deus a ter resposta para uma inquirição banal, colocando em dúvida o poder divino.","3":"O aforismo criado pelo narrador no desfecho confirma o posicionamento dele quanto à injustiça de que foi vítima o personagem que “acreditava na lei”.","4":"Transpondo-se para o discurso indireto o diálogo, tem-se: Ele replicou que a lei não exigia aquilo. O verbo no presente, no discurso direto, passa para o pretérito imperfeito, no discurso indireto.","5":"O movimento romântico surge na Europa em meio às transformações sociais causadas pela ascensão da burguesia e pela industrialização. Relacionada também com o movimento alemão “Sturm und Drung” (Tormenta e Ímpeto) e com os ideais da Revolução Francesa, essa nova estética é um protesto cultural contra a aristocracia e a arte dessa classe, o Arcadismo ou o Neoclassicismo. No Brasil, o Romantismo desenvolve-se em meio a uma sociedade escravocrata, a uma burguesia nascente e ao contexto da recente independência do país. Por isso, enfatizam-se idealmente questões ligadas ao processo de formação da identidade nacional, escondendo-se as mazelas do país.","6":"Logo no início do texto, o pai censura o filho que, depois de abandonar o lar em busca de uma vida mais pródiga, dispendiosa, frustra-se e retorna tão decepcionado ao ponto de o pai perceber e angustiar-se com o infortúnio.","7":"Nas falas do pai, há valorização da moderação, tendo como base a alimentação. Esse argumento é um contraponto ao elogio da prodigilidade feito pelo filho. O comedimento é enaltecido pela figura paterna nos seguintes trechos: “Nossa mesa é comedida, e austera, não existe desperdício nela, salvo em dias de festa”; ”O apetite é permitido, não agrava nossa dignidade desde que seja moderado”.","8":"Os fantasmas do passado, vistos apenas pelo avô, são menos aterrorizantes do que os do futuro, vistos por toda a família.","9":"No terceiro quadrinho, o emprego de “somos”, na primeira pessoa do plural, não concorda com o sujeito “toda a família”, que obrigaria o verbo a ficar na 3a pessoa do singular. Assim, o cartunista Quino fez uma concordância ideológica, em que se incluiu como membro da família.","11":"O trecho trata de uma questão de interesse público na Coreia do Sul relacionada à poluição do ar e aos riscos à saúde causados por partículas finas de pó. Lê-se no texto: “In fact, the fine dust has South Koreans so concerned they’ve cited it as their No. 1 stressor in life...” * dust = pó * concerned = preocupado","12":"De acordo com o terceiro parágrafo, PM2.5 é atualmente um tópico de grande preocupação em Seoul porque recentemente atingiu níveis muito acima daqueles aceitos pela OMS como sendo considerados seguros para a vida dos humanos. No texto: “The World Health Organization (WHO) advises exposure to fine dust, or PM10, of no more than a daily average of 50 micrograms per cubic meter, and to ultra-fine dust, or PM2.5, of no more than 25. At one point in 2017, Seoul’s PM10 hit 179. In late March 2018, Seoul’s PM2.5 soared to over 100.”","13":"O texto conclui afirmando que inovações tecnológicas na Coreia do Sul tornaram possível a medida de emissões de poeira, mas ainda não acharam maneiras de suprimi-las. Lê-se no texto: “Although much of the new tech appears promising, Greenpeace’s Seoul office stresses the importance of addressing the root of the problem. Part of the solution is getting residents to recognize their own role in curbing carbon output. So, even though the new fixes may do a good job of measuring dust, what about actually busting it? That’s where the technology hasn’t quite caught up yet.” * to address = abordar * root = raiz * role = papel * to curb = reduzir, diminuir * output = produção * to bust = eliminar, acabar com * to catch up = alcançar, atingir","14":"No texto lê-se: “Make a difference. Choose sustainable fish.” *Sustainable fish = peixe obtido por meio de medidas sustentáveis de pesca.","15":"A formulação da questão implica mais conhecimentos dos candidatos do que informações propriamente dedutíveis do enunciado. Estas últimas limitam-se à prática da agricultura, dedutível pela referência à emprego da coivara.","16":"A crise do Sistema Colonial, manifestada a partir da segunda metade do século XVIII, vincula-se à crise concomitante do Antigo Regime europeu, podendo ser entendida como resultado da passagem do capitalismo comercial (ou acumulação primitiva de capitais) para o capitalismo industrial. A progressão do liberalismo iluminista, combatendo as práticas mercantilistas, foi um dos aspectos dessa transformação.","18":"A comparação entre os dois mapas demonstra que, no século XVII, a presença europeia na África restringia- se a sua porção litorânea, em função do comércio de produtos locais e sobretudo do escambo de escravos. Já a interiorização do processo colonizador ocorreu no último quartel do século XIX, motivada pelas necessidades da Segunda Revolução Industrial, sendo sistematizada em 1885 pela Conferência de Berlim.","19":"A Política da Boa Vizinhança, inaugurada pelo presidente Franklin Roosevelt em 1934, visava desviar as repúblicas latino-americanas de uma possível aproximação com os totalitarismos europeus emergentes. Por meio de um apelo à solidariedade continental e à superação da Política do Big Stick, os Estados Unidos consolidariam sua liderança nas Américas, com o intercâmbio cultural e as relações comerciais consolidando esse processo.","20":"Alternativa escolhida por eliminação, pois antecipa para 1970 uma crise econômica que somente se patentearia em 1973, com os efeitos do primeiro choque do petróleo. Todavia, não deixa de ser correta a alusão à situação das classes menos favorecidas, afligidas pela miséria crônica e às quais o governo procurava impingir a vitória brasileira na Copa do Mundo. Acrescente-se que, muito embora as autoridades enfatizassem o “Milagre Brasileiro”, este estava sendo construído sobre uma base econômica excludente, em grande parte devida ao arrocho salarial.","21":"O mapa retrata a região do Oriente Médio, que abriga as maiores reservas petrolíferas do mundo, que ocorrem no Golfo Pérsico. A partir daquela região, o petróleo é escoado para os maiores consumidores deste combustível fóssil, sobretudo os países desenvolvidos e emergentes. Assim, os EUA, por serem o maior consumidor de petróleo do mundo, dependem do escoamento realizado pelo Estreito de Ormuz, devido a sua importância geopolítica por abrigar as maiores rotas e tráfego de petróleo.","22":"Na atualidade, grupos de jovens usam vídeos para reivindicações sociais, expressões culturais e mostrar como veem a metrópole paulistana. A redução dos preços e a fácil portabilidade dos equipamentos audiovisuais, aliadas à ampliação dos cursos de formação e a linhas de financiamento para a produção, motivaram jovens a se unir e criar coletivos dedicados a mostrar uma nova visão da metrópole paulistana. Estes vídeos diferem dos chamados vídeos populares dos anos 1970 e 1980, que tinham um direcionamento político afinado com as lutas operárias e os movimentos contra a ditadura.","23":"Os deslizamentos ocorrem com maior frequência nos meses de verão em áreas de clima tropical, tendo em vista que os elevados índices pluviométricos típicos da estação, associados às áreas de maior declividade, levam à saturação dos solos, provocando os escorregamentos. Estes eventos geomorfológicos intensificam-se em razão da ocupação desordenada, fruto da falta de planejamento urbano, que leva à ocupação desordenada nas áreas de encosta.","24":"O mapa ilustra a antropomorfização do território brasileiro de 1960 a 2000. Entende-se por antropomorfização a ocupação do território pela população, expansão da atividade ALBERT EINSTEIN - DEZEMBRO/2018","26":"No sistema de transporte do Brasil predomina o modal rodoviário, reflexo de uma estratégia estatal que remonta o início da industrialização moderna brasileira, na década de 1950. Diferentemente daquela época – quando ainda não havia preocupação com os preços do petróleo, pois sequer a Organização dos Países Exportadores de Petróleo (OPEP) existia, ou com questões de natureza ambiental, havia forte estímulo à expansão dos transportes baseados no motor à explosão. As ferrovias, que tiveram seu auge no período da cafeicultura – entre o fim do século XIX e início do século XX, deterioraram-se com a crise no setor cafeeiro, a partir e 1930, e sucumbiram às rodovias, mais versáteis e que se expandiram mais rapidamente. Hoje a prevalência do modal rodoviário cobra o seu preço – poluição, menor competividade – refletindo a precariedade do planejamento logístico do país, que anda devagar no desenvolvimento da intermodalidade.","27":"Em uma célula 2n = 8 observada em anáfase I da meiose, na qual ocorre separação dos cromossomos homólogos, será notada a migração de 4 cromossomos ainda duplicados para cada polo da célula.","28":"O segmento de DNA que realizou a transcrição possui um maior número de bases que aquele presente no RNAm funcional. O RNAm “maduro” associou-se a um ribossomo que orientou a tradução de uma proteína com 123 aminoácidos porque cada códon, contendo 3 bases, codifica um aminoácido.","29":"As duas espécies de raposas são, em verdade, duas subespécies de uma única espécie, pois são originadas de um grupo ancestral, porém o isolamento geográfico não as levou ao isolamento reprodutivo.","30":"Alelos: a (acromatopsia) e A (normalidade) Pais de Renan e Bárbara: AA x Aa P (Renan ser Aa) = 1/2 P (Bárbara ser Aa) = 1/2 P (menino e aa) = 1/2 x 1/4 = 1/8 P = x x =","31":"Se somente uma das amostras fornecidas pelo professor dissolve-se em água, ou é carbo em como sua característica principal a reprodução de maneira direta e literal do diálogo, introduzido por travessão. Assim, a transposição do trecho “ele perguntou como é que eu tinha deixado os meus dentes ficarem naquele estado” se daria pela ação direta e pontual do verbo: “Ele perguntou: — Como você deixou seus dentes ficarem nesse estado?”","6":"O efeito de humor do cartum está na utilização do recurso da personificação para sugerir o caráter abrupto do retorno às aulas, que “pula no pescoço”.","8":"O autor apresenta-se de forma explícita em “Mas é só na nossa época”, empregando pronome de primeira pessoa do plural (nossa), integrando-se, assim, ao grupo mencionado.","9":"A referência “aos métodos científicos de observação e experimentação” remete à estética naturalista que aplica nos conflitos das personagens as leis da ciência da segunda metade do século XIX, principalmente o Determinismo (de raça, meio e momento), criado por Hippolyte Taine.","11":"O texto discute um assunto de preocupação global nos dias atuais, a saber, a escala sem precedente na qual as ações dos cidadãos estão sendo monitoradas.","12":"No primeiro parágrafo, a palavra “terrifying” está sendo usada para se referir a um ato de preservar sua própria privacidade, sendo interpretada como uma tentativa de esconder algo. No texto” “If you want to protect your privacy, it must be because you have something to hide.”","13":"O segundo parágrafo menciona uma contradição, que é o fato de que as pessoas em regimes controlados mais antigos estavam menos sujeitas a monitoramento do que as pessoas em sociedades abertas atuais. Lê-se, no texto: “Until recently, even people living in a police state could count on the fact that the authorities didn’t have enough equipment or manpower to observe everyone, everywhere, and so enjoyed more freedom from monitoring than we do living in a free society today.”","14":"Rio de Janeiro é mencionado porque ilustra o argumento de que certos usos da tecnologia para coletar informações sobre cidadãos são também um tipo de policiamento. Lê-se, no texto: “... cities are embracing technology to collect data on citizens, ostensibly to make public services and urban spaces function better. But what smart cities also enable is a new form of policing.”","15":"No último parágrafo, o autor afirma que o crescimento humano requer a existência de uma esfera de vida fora da análise pública; não apenas dentro da intimidade do lar, mas também em espaços semiprivados, como o local de trabalho, igreja ou o lar. É o tipo de local protegido de controle que está progressivamente desaparecendo. Conforme o trecho “Human flourishing requires the existence of a sphere of life outside public scrutiny; not only within the intimacy of the home but also in semi-private spaces such as the workplace or the church or the pub. It’s that kind of space shielded from scrutiny that increasingly is vanishing.”","16":"Interpretação de texto, pois o enunciado afirma que os médicos judeus, mais qualificados que os cristãos, eram solicitados a tratar das pessoas pertencentes aos estratos sociais mais elevados, como senhores e burgueses.","17":"A tabela menciona o número de óbitos ocorridos na cidade fabril de Sheffield em plena Revolução Industrial Inglesa. Os fatores que concorreram para os falecimentos mencionados são, em grande parte, resultantes da poluição provocada pelo uso do carvão e também pelas péssimas condições de habitação existentes nos centros industriais britânicos. Um fator adicional não desprezível é o número de acidentes de trabalho, decorrentes da falta de segurança nas instalações produtivas.","18":"A charge apresentada na questão constitui um exemplo da virulenta campanha contrária ao programa de vacinação antivariólica obrigatória, desenvolvido pelo sanitarista Osvaldo Cruz em 1904, dentro do projeto modernizador do Rio de Janeiro, elaborado no “Quadriênio Progressista” de Rodrigues Alves. A falta de informações e a maneira truculenta com que as autoridades atuaram seriam o fator catalisador da Revolta da Vacina, irrompida em novembro daquele ano.","19":"Percepções médicas: o caráter epidêmico da varíola e a capacidade de conter seu alastramento por meio da vacinação. Percepções sociais: a vulnerabilidade da população pobre e afrodescendente em relação à epidemia, e o atendimento inadequado prestado pelo lazareto (sanatório), o que aumentava a mortalidade da população humilde. Percepções religiosas: a epidemia de varíola teria sido obra de uma divindade africana – Omolu – para atingir os brancos, mas que se voltara contra os descendentes de africanos, apesar dos esforços do deus para transformá-la em alastrim (forma benigna da doença). O texto contempla também percepções combinadas, a saber: religiosa e social, quando o povo de Omolu pede para que a moléstia alcance os fazendeiros do sertão; e sociais e médicas, expressas na constatação de que os proprietários ricos do interior, por falta de conhecimento, não recorriam à vacinação para se precaverem contra a varíola.","20":"A aids é um grave problema de saúde pública que provoca grande número de mortes em diferentes regiões do continente africano, principalmente na África Subsaariana. O avanço da doença está diretamente relacionado com a precariedade dos sistemas de saúde e com a ausência de políticas públicas capazes de conter a pandemia.","21":"O mapa mostra que a espacialização da H1N1 envolve uma dispersão geográfica que abrange áreas de diferentes níveis de desenvolvimento socioeconômico, zonas climáticas distintas e presença em diversos continentes. A expansão da pandemia de H1N1 está, portanto, relacionada com a intensificação das conexões globais.","22":"A “deseconomia de aglomeração” refere-se às desvantagens que surgem em áreas de concentração industrial devido à perda da funcionalidade de fatores que em outro momento constituíram vantagem material que levou determinada região a ser escolhida para receber plantas industriais. Por exemplo: colapso no sistema de circulação e escoamento da produção, ineficiência nos setores de energia e de comunicações, organização sindical do trabalho, especulação imobiliária, gastos com segurança etc.","24":"Os mapas revelam, sobretudo no período de 1991- 2000, o crescimento demográfico elevado, no norte, e principalmente no sul do município de São Paulo, áreas onde se localizam os principais mananciais da cidade, como as represas de Guarapiranga e Billings, ao sul, e Cantareira, ao norte. As demais alternativas estão incorretas devido aos seguintes aspectos: b) O complexo metropolitano envolveria os vários municípios da grande São Paulo e não apenas o município de São Paulo. c) A expansão não se deu em áreas de parques. d) Não ocorreu uma retração da área central, muito menos uma desmetropolização. e) Os mapas não têm relação alguma com o déficit público.","25":"A sequência das fotos sugere o exercício da análise dos solos, partindo de suas características morfológicas, o que gera informações acerca da qualidade, origem, constituição química, permitindo diagnosticar inclusive o grau de fertilidade e as necessidades de eventuais correções para o plantio.","26":"O desenvolvimento sustentável tem como principais premissas a manutenção de processos de produção, circulação e consumo de bens sem que ocorra o comprometimento dos recursos naturais no presente e nas gerações futuras.","27":"A Taenia solium é um verme hermafrodita capaz de realizar autofecundação. Como ocorre a reprodução sexuada haverá variabilidade genética entre os ovos formados, em consequência da permutação e segregação independente ocorrida na gametogênese e o encontro ao acaso dos gametas na fecundação.","28":"A planta com maior proximidade evolutiva com a papoula (Papaver somniferum) será encontrada no mesmo gênero que esta (o gênero Papaver), o que significa dizer que apresentam grande semelhança por pertencerem ao mesmo Reino, Filo, Classe, Ordem, Família e Gênero.","29":"A relação ecológica representada na tirinha, entre um pássaro palito e um jacaré, é um exemplo de cooperação. Tal relação pode ser observada também entre uma anêmona-do-mar e o caranguejo-eremita. A cooperação é uma relação ecológica harmônica, interespecífica e não obrigatória.","30":"A queda na produção do ATP a partir da seta no gráfico indica uma mudança no padrão metabólico da levedura onde de um ambiente aeróbico, a levedura passa para um ambiente anaeróbico. Em ambiente anaeróbico se realiza a fermentação alcoólica segundo a reação: C6H12O6 →2 piruvato →2 etanol (C2H5OH) + 2 CO2 + 2 ATP.","31":"Em uma das diferentes modalidades de terapia genética, seria possível substituir genes defeituosos por sequências de DNA que produzam proteínas funcionais, as quais podem restabelecer o correto funcionamento celular e tecidual anteriormente afetado e causador da doença alvo.","32":"A liga metálica apresentada é condutora de eletrici - dade e possui baixo ponto de fusão (343K = 70°C). Assim, pode ser utilizada como fusível de dispositivos eletroeletrônicos, pois apresenta baixa temperatura de fusão.","33":"O volume da salmoura é igual ao volume de água: 100L de água = 100L de solução. A massa molar do ácido cítrico mono-hidratado é 2 x 102 g/mol. A massa do ácido cítrico mono-hidratado é 1kg ou 1000g. A concentração em quantidade de matéria de ácido cítrico, nessa salmoura, é: M = = 0,05 mol/L","34":"Equação da reforma do metano: CH4(g) + H2O(g) → CO(g) + 3H2(g) – 75kJ – 242kJ –111 kJ 0 144424443 144424443 ∑ΔHf(reagentes) = –317 kJ ∑ΔHf(produtos) = – 111 kJ+ 0 kJ Cálculo da variação de entalpia (ΔH): ΔH = ∑ΔHf(produtos) – ∑ΔHf(reagentes) ΔH = [(–111) – (–317)] kJ ΔH = + 206 kJ 206 kJ –––––––– 3 mol de H2 x –––––––– 1 mol de H2 x \u0002 68,67 kJ A produção de cada mol de hidrogênio pela reforma a vapor do metano absorve, aproximadamente, 69 kJ.","35":"Consultando a tabela periódica fornecida, nota-se o número atômico do ouro (Au) igual a 79. Assim, considerando o ouro-198 um emissor β–, temos o seguinte decaim ","2":"Segundo a autora, as sociedades modernas impuseram a necessidade de bem-estar e felicidade aos cidadãos, por esse motivo há, nessas sociedades, muita dificuldade para se lidar com a depressão, estado psíquico que representa o avesso do deleite e do gozo.","3":"O advérbio “talvez” indica dúvida e incerteza; a preposição “até”, como sinônimo de “inclusive”, é uma partícula que denota inclusão.","5":"O Dr. Café é corruptível, pois a carta de recomen - dação do senador Xisto para que o portador fosse nomeado para exercer a função de porteiro do albergue da Ilha do Governador acabou destruindo a intenção do doutor Café de não se render à pressão de pessoas influentes quando elas indicassem protegidos para os cargos. O discurso ético não se comprovou diante da realidade dos fatos. Prevaleceu o pistolão.","6":"A expressão “aos quatro ventos” é empregada em sentido figurado, é metafórica, apresenta o campo semântico de divulgar sem restrição de espaço e espalhar para todos um propósito ou uma notícia.","7":"Em discurso direto, o pretérito imperfeito do subjuntivo passa a imperativo: Deu ordem a um contínuo: – Faça-o entrar.","8":"No texto de Anatol Rosenfeld, a passagem “revelação da verdade íntima do criador” remete tanto ao Romantismo, como também ao Simbolismo. Essa ambiguidade é solucionada no momento em que o crítico afirma que “Esse novo movimento tende a se importar mais com a autoexpressão da subjetividade”, contrapondo essa característica ao que foi mencionado anteriormente, a submissão do poeta às regras eternas e universais do Classicismo. A oposição aos ideiais clássicos e o conceito estético de que a perfeição é nociva são características que só podem ser atribuídas ao Romantismo.","9":"As rosas do jardim de Adônis são inconscientes, inscientes a respeito da duração da sua existência efêmera. Nascem e morrem enquanto há a lumino - sidade do sol, não conhecem o lado noturno, sombrio da existência. Nesse poema de Ricardo Reis, um dos heterônimos de Fernando Pessoa, a inconsciência sobre a efemeridade deve ser a postura que eu lírico e Lídia devem seguir: não ter preocupação com o lado agônico e sombrio da existência, ainda que ela seja breve.","10":"O primeiro pronome relativo, “que”, no início do terceiro verso, substitui a palavra antecedente “rosas”, no final do segundo verso. O segundo pronome relati - vo substitui a palavra “dia”.","11":"Há vários exemplos de orações em ordem indireta no poema, e hipérbato é o nome dado a essa inversão da ordem natural dos termos na oração. Em ordem direta, tem-se: sujeito + verbo + complementos. Colocando-se os primeiros versos em ordem direta tem-se: Amo as rosas dos jardins de Adônis, Lídia, amo rosas, essas volucres, Que em um dia que nascem, Morrem em esse dia.","13":"No que diz respeito à Grã-Bretanha, ambas as cartas referem-se a atitudes da população que fizeram diferença no início de 2020.","14":"Em sua carta , Barbara Mark desconfia dos resultados de uma pesquisa a respeito das ideias do público em geral sobre a política da covid-19 no país.","15":"A seguinte afirmação é uma opinião explícita do escritor da segunda carta: O governo deve fazer sua parte se o país pretende assumir um senso de solidariedade muito forte.","16":"A afirmação citada no primeiro parágrafo da segunda carta, “goodwill closely followed infection rates”, significa que na Grã-Bretanha, este ano, à medida que o ritmo de infecção por covid-19 declinava, também diminuíam as contribuições para os necessitados.","17":"A figura no texto está diretamente relacionada à seguinte ideia: A atitude de ficar longe um do outro ajudou a bloquear a disseminação da covid-19.","18":"Mais do que as características do sistema feudal, tal como se definiu nos primeiros séculos da Idade Média, a questão aborda mudanças ocorridas nos três últimos séculos do Baixo Império Romano e suas tentativas de sobreviver à sua própria crise: a partir do reinado de Constantino, o imperador perdeu efetivamente sua essência divina; e em 380, pelo Edito de Tessalônica, Teodósio oficializou o cristianismo, em um esforço para canalizar o apoio da Igreja às enfraquecidas instituições do Império Romano.","19":"No período citado, o déficit crônico da balança comercial portuguesa foi em grande parte coberto pelo ouro extraído no Brasil. Essa situação beneficiou os países com quem Portugal mantinha relações econô micas mais estreitas. Tal conjuntura foi particu - larmente favorável à acumulação capitalista na Inglaterra, mormente após a assinatura do Tratado de Methuen, em 1703.","20":"A questão privilegia os fatores econômicos que levaram à independência da América Espanhola. Nesse sentido, sobressaem as restrições impostas ao comércio colonial pelas limitações mercantilistas impostas pela Espanha. O contraponto dessa estrutura era o liberalismo, defendido pela Inglaterra e que levou essa potência a apoiar o processo emancipacionista hispano-americano.","21":"A alternativa D elenca efetivamente alguns dos mais importantes aspectos do movimento de Canudos e a maneira como foi encarado pelas autoridades da República Brasileira, desde o nível local até o federal. Entretanto, a questão de Canudos não envolve a luta pela terra, pois em nenhum momento os sertanejos do arraial se propuseram a tomar as propriedades dos “coronéis” da região (Canudos foi instalado no terreno de uma antiga fazenda abandonada).","22":"A questão aborda a gênese do movimento em prol da descolonização africana, quando os naturais do erroneamente chamado “continente negro” (tendo em vista as características étnicas predominantes na África do Norte), conscientes do caráter espoliador do colonialismo europeu, passaram a reivindicar sua independência. Nesse processo, a busca de uma identidade africana comum desempenhou um papel relevante.","23":"As disputas que por vezes se observam entre os EUA e a Rússia fazem lembrar aquelas que ocorreram durante a chamada “Guerra Fria”, período vivido entre 1948 e 1990, quando essas duas potências dividiam a influência mundial entre si. Dentro da disputa ideológica, política, econômica e militar, destacou-se a corrida espacial, na qual estadunidenses e soviéticos lutaram para ver quem colocaria primeiro um satélite no espaço e o ser humano na Lua.","24":"A Amazônia sempre se configurou como uma preocupação para os militares por se configurar numa região despovoada e aberta, sensível a possíveis invasões de forças externas. Assim, entre as políticas de integração nacional, propostas pelos governos daquela época, estavam as construções de vias de acesso (principalmente rodovias) que permitiriam a migrantes vindos de outras regiões brasileiras ocuparem a região demograficamente.","25":"O pluviograma em questão apresenta um tipo climático que pode ser classificado como tropical semiúmido do Hemisfério Sul, com chuvas de verão- outono e secas de inverno-primavera. As temperaturas são elevadas, com pequenas baixas no período do “inverno”, e essas características permitem o desenvolvimento da vegetação de savanas arbustivas, que, na foto C, provavelmente retratam a imagem observável no território africano.","26":"O fenômeno da ilha de calor é típico de áreas urbanas verticalizadas, sem cobertura vegetal e com imper - mea bilização do solo. Na cidade de São Paulo, ocorrem em diversos dias do ano e estão relacionadas ao calor latente do clima tropical.","27":"A cidade de Berlim está localizada em GMT +1, ou seja, 15° Leste, logo, com a diferença de 8 horas a menos, a longitude está a 105° Oeste, ou GMT – 7.","28":"O quadro febril é ocasionado pela ruptura das hemácias e liberação dos merozoítos (4). O ciclo sexuado ocorre no mosquito, que é o hospedeiro definitivo para a malária (5).","29":"A análise do gráfico permite perceber que a maior produtividade primária (eixo Y) ocorre quando há a presença de 15 espécies diferentes de gramíneas, o que representa maior diversidade biológica.","30":"A remoção da gema apical diminui a taxa de auxinas no caule e consequentemente cess "49":15,"50":15,"45":15,"46":15,"47":15,"48":15},"explanations":{"1":"Lê-se no terceiro quadrinho da tirinha: “...but the world might tell me it’s not good.” mas o mundo poderia dizer me que não é bom","3":"A fiscalização do mercadinho é onisciente, como se nota nesta passagem: \" um olho invisível, múltiplo e implacável, controla os menores movimentos da freguesia, devassa o mistério de bolsas e de bolsos, quem sabe se até pensamento. \"","4":"O trecho transcrito revela o pensamento da “velhinha estrangeira” no meio do discurso do narrador onisciente.","5":"A expressão própria da linguagem coloquial é “aquela joça”, termo empregado com o sentido de “coisa ordinária, ruim ou malfeita”. Pelo contexto, percebe- se que “joça” se refere ao mercadinho no qual se passa a cena retratada na crônica de Drummond.","6":"O processo de derivação regressiva ocorre na alternativa C, no termo “estranja”, vocábulo de uso informal derivado de “estrangeiro”, usado para designar “conjunto de países estrangeiros; o exterior”, segundo definição apresentada no dicionário Houaiss.","7":"O verdadeiro insabido seria a ignorância daquilo que não sabemos. À medida que se obtém o conhecimento, aumenta-se a superfície da esfera cognoscível, mas vai também expandindo-se o que se ignora , o que está além da esfera, isto é, \"todas as coisas que nem sabemos que não sabemos\".","8":"A locução conjuntiva “ à medida que” expressa ideia de proporção em relação à oração “surgem novas perguntas”, evidenciando que a curiosidade manifestada por meio de perguntas sobre o desconhecido vão, gradativamente, ampliando o conhecimento.","9":"Esse excerto faz referências inequívocas ao Modernismo, principalmente à primeira geração dessa estética, quando afirma que as \"vanguardas francesas e italianas\" foram o paradigma para se captarem o\" ritmo das grandes cidades\" e \" o mundo mecanizado\" . Outra característica do Modernismo é a valorização do primitivo, algo que era inerente à realidade brasileira.","11":"O texto é principalmente sobre o ressurgimento de marcas locais na China em anos recentes.","12":"De acordo com o segundo parágrafo, a posição de produtos domésticos no mercado chinês no final de 2020 foi deveu-se a, entre outros, a habilidade de empresas locais ampliarem de maneira eficaz as vendas online.","13":"O último parágrafo faz referência a importância de inovação para atrair novos clientes.","14":"O excerto apresenta algumas das ações impostas pela metrópole portuguesa visando a uma efetiva ocupação territorial e estruturação da exploração colonial, tendo como base a produção canavieira, em regime de plantation escravista. Essa escolha obedeceu à lógica do mercantilismo na busca dos lucros metropolitanos com a exportação do açúcar.","15":"Embora contrário ao colonialismo da França, a independência do Haiti foi fortemente influenciada pelo iluminismo francês. Ademais, a emancipação de São Domingos seguiu, em parte, o processo revolucionário da metrópole, principalmente no que concerne ao radicalismo jacobino. Obs.: os cortes textuais realizados pelo examinador parecem sugerir que o texto do historiador Jacob Gorender relaciona a independência feita por ex- escravizados com o subdesenvolvimento do país.","16":"A imagem publicada na Revista Ilustrada, um dia após a proclamação da República, exalta o papel dos militares – no caso, Deodoro da Fonseca, ao fundo – e constrói uma visão pacífica da implantação do novo regime.","17":"A política descrita teve como base o Plano de Metas, em que diversas áreas, desde a infraestrutura até o desenvolvimento industrial, tinham como propósito modernizar o País. A implantação do nacional-desen - volvimentismo somente foi possível por meio de vias de investimento e redirecionamento de verbas públicas (ação do BNDE) aliadas a demais advindas de capitais estrangeiros (capitalismo associado).","18":"O grupo em questão, o Talibã, foi uma das forças que lutou contra e forçou os soviéticos a deixar o país em 1989. Após um período de quase dez anos de guerra civil, o Talibã venceu os demais grupos disputantes e assumiu o poder no Afeganistão impondo preceitos islâmicos de maneira fundamentalista. Ao dar guarida ao grupo Al Qaeda, que perpetrou os ataques aos EUA em 2001, o Talibã acabou sendo deposto após a invasão estadunidense em fins do mesmo ano. Após 20 anos, com a retirada das forças dos EUA, o grupo volta ao poder.","19":"O Brasil é um dos maiores fornecedores de minério de ferro do mundo e um dos principais abastecedores da economia chinesa. Uma queda no consumo desse minério por parte dos chineses, afetados por diversos problemas econômicos e ambientais, pode impactar fortemente na renda de empresas brasileiras, tais como a Cia. Vale.","20":"Ideias preconcebidas de que o imigrante possui baixo grau de instrução, ou não se adaptará aos preceitos utilizados pelas empresas empregadoras (tais como língua, costumes etc.), acabam resultando numa aversão ao trabalho desse estrangeiro, implicando alto grau de desemprego, levando inclusive alguns grupos a deixar o Brasil, como ocorreu com vários haitianos, por exemplo.","21":"Em depósitos sedimentares mesozoicos (entre 100 milhões e 200 milhões de anos), identificados pelas manchas verdes, ocorreram intensas deposições de materiais orgânicos que, entremeados a sedimentos, acabaram concentrando-se em bolsões. Num processo físico-químico de decomposição, o material orgânico, constituído principalmente por plâncton marinho, deu origem a hidrocarbonetos, como os componentes do petróleo e o gás natural. Os depósitos aparecem espalhados por várias regiões da América (Bacia do Mississipi, do Orenoco, por exemplo), Ásia (Golfo Pérsico, Sibéria) e África (norte do Saara, por exemplo).","22":"Ocorrida em 1992, a 2.ª Conferência da ONU Sobre Meio Ambiente, conhecida como Rio+20, reforçou os conceitos de desenvolvimento sustentável e criou várias frentes de trabalho, entre elas, a Agenda 21 (35 propostas para melhor gerenciamento ambiental a serem implementadas no decorrer do século XXI). A conferência de Estocolmo, na Suécia, ocorrida em 1972 (1.ª Conferência da ONU Sobre Meio Ambiente), foi a primeira conferência de âmbito mundial a tratar a questão ambiental de maneira global, com a criação dos primeiros programas de preocupação ambiental; ela deu origem às demais reuniões ambientais que ocorreram nos anos seguintes.","23":"Toda projeção cartográfica implica distorções no traçado da Terra, preservando alguns elementos, mas distorcendo outros. No caso em questão, procurou-se manter as formas e as áreas dos continentes, contudo, tanto os oceanos quanto partes de alguns continentes, aparecem descontínuos (“cortados”).","24":"O ácido úrico é uma excreta nitrogenada praticamente insolúvel e pouco tóxica. Logo, o indivíduo que realiza sua excreção tem uma baixa perda de água. Considerando a Caatinga como um ambiente com escassez hídrica, a espécie 5, por possuir uma maior concentração de ácido úrico, será aquela mais bem adaptada a esse bioma.","25":"O estudo citado no texto sugere que pode ter ocorrido, de modo aleatório no ancestral humano, um processo de mutação em um ou mais éxons (porções codificantes) do gene CMAH, levando a essa predisposição de formação de placas de gorduras nos vasos sanguíneos.","26":"Da análise da figura e de posse de conhecimentos prévios, é possível afirmar que o coronavírus, por se tratar de um vírus e consequentemente ser um parasita intracelular obrigatório, utiliza a energia, a matéria orgânica, os ribossomos e os RNA transportadores da célula hospedeira para empreender o processo de replicação viral.","27":"O ganho significativo de massa vegetal é resultado do processo de fotossíntese, o qual utiliza gás carbônico atmosférico (fonte de carbono) e água do solo (fonte de hidrogênio) necessários à sintese de matéria orgânica.","28":"O herbicida, por interferir na associação das tubulinas (proteínas presentes nas fibras do fuso), compromete o processo de anáfase da mitose das células meri
